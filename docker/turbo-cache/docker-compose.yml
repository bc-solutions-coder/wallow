# Self-hosted Turborepo remote cache. Runs on the build server, NOT as part of
# `pnpm backend:infra` - it is developer infrastructure, unrelated to the
# Wallow stack.
#
# Main CI reaches this service through Tailscale. Developer machines use local
# caching. Bind to the host's tailnet address; the loopback default keeps a new
# deployment private until configured. TURBO_TOKEN is a CI-only bearer token.
# The independent artifact signing key belongs only in GitHub production.
services:
  turbo-cache:
    image: ducktors/turborepo-remote-cache:2.12.0@sha256:d5cd81fc2f289b6c37ad8f3361a9abab5c359577d7809981ece045cefc21756f
    restart: unless-stopped
    environment:
      PORT: "3000"
      TURBO_TOKEN: ${TURBO_TOKEN:?set TURBO_TOKEN in docker/turbo-cache/.env}
      # In pinned 2.12.0 this is only a metadata-storage toggle, not an HMAC
      # key. Clients sign and verify; never give the server the signing key.
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: enabled
      STORAGE_PROVIDER: local
      STORAGE_PATH: /tmp/turbo-cache
      # Use this exact path inside the persistent volume.
      STORAGE_PATH_USE_TMP_FOLDER: "false"
      LOG_LEVEL: info
      ENABLE_STATUS_LOG: "false"
    volumes:
      # /tmp exists in the image with mode 1777, so a fresh volume lets the
      # non-root service create its own cache directory without host chown.
      # Existing volumes retain their permissions and may need owner repair.
      - turbo-cache-data:/tmp
    ports:
      - "${TURBO_CACHE_BIND_ADDR:-127.0.0.1}:3000:3000"

volumes:
  turbo-cache-data:
