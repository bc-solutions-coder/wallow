# Self-hosted Turborepo remote cache. Runs on the build server, NOT as part of
# `pnpm backend:infra` - it is developer infrastructure, unrelated to the
# Wallow stack.
#
# The cache is reached over the Tailscale tailnet, not a public hostname: CI
# joins the tailnet inside the workflow (tailscale/github-action in js.yml) and
# laptops must be on it. Authentication is TURBO_TOKEN alone - turbo sends only
# `Authorization: Bearer`, so nothing that needs its own header or login can be
# layered in front (this is what killed the original Cloudflare Tunnel design;
# see Wallow-m4u7). Set TURBO_CACHE_BIND_ADDR to the host's tailscale IP so the
# listener is reachable from the tailnet and nowhere else; the 127.0.0.1
# default keeps a copy-paste deployment private until that choice is made.
services:
  turbo-cache:
    image: ducktors/turborepo-remote-cache:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      TURBO_TOKEN: ${TURBO_TOKEN:?set TURBO_TOKEN in docker/turbo-cache/.env}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${TURBO_REMOTE_CACHE_SIGNATURE_KEY:?set in .env}
      STORAGE_PROVIDER: local
      STORAGE_PATH: /cache
      # Default is true, which would prefix STORAGE_PATH with the system tmp
      # dir - and lose the whole cache on reboot.
      STORAGE_PATH_USE_TMP_FOLDER: "false"
      LOG_LEVEL: info
      ENABLE_STATUS_LOG: "false"
    volumes:
      - turbo-cache-data:/cache
    ports:
      - "${TURBO_CACHE_BIND_ADDR:-127.0.0.1}:3000:3000"

volumes:
  turbo-cache-data:
