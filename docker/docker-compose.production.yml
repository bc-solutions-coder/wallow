# =============================================================================
# Wallow Production Stack
# =============================================================================
# Fully self-contained — runs locally or on a server with the same command.
# The `caddy` service below is a REFERENCE ingress: it owns :80/:443 and is the
# only externally reachable service. The three app containers publish their ports
# on 127.0.0.1 only, so they stay available for local debugging (curl, a tunnel)
# without being exposed to the network. Swap Caddy for your own ingress by
# removing the service and re-pointing those loopback ports — see the header of
# caddy/Caddyfile.example for the contract any replacement must honour.
#
# Two topologies are supported:
#
# Path-based routing (default):
#   wallow.dev/api/*  -> wallow-api:8080   (forward full path, app uses PathBase=/api;
#                                           do NOT strip the /api prefix in the proxy)
#   wallow.dev/auth/* -> wallow-auth:8080  (Node app, apps/wallow-auth, BUILT with
#                                           AUTH_BASE_PATH=/auth; it serves SSR HTML,
#                                           assets and passthrough routes under that
#                                           prefix, so do NOT strip /auth either)
#   wallow.dev/*      -> wallow-web:8080
#   Containers expose HTTP only; TLS terminates at the ingress.
#
# Subdomain routing (set API_PATH_BASE= and AUTH_BASE_PATH= empty in .env.production):
#   api.wallow.dev/*  -> wallow-api:8080   (app serves at subdomain root, PathBase empty)
#   auth.wallow.dev/* -> wallow-auth:8080  (Node app serves at root)
#   wallow.dev/*      -> wallow-web:8080
#   Also align API_PUBLIC_URL / AUTH_PUBLIC_URL (and COOKIE_DOMAIN) to the subdomains,
#   and use the commented subdomain site blocks at the bottom of the Caddyfile.
#   The pangolin profile ALWAYS uses this topology — its blueprint labels
#   declare three host-based resources (PANGOLIN_RESOURCE_DOMAIN,
#   PANGOLIN_API_DOMAIN, PANGOLIN_AUTH_DOMAIN), because the pulled images
#   serve at their roots and a tunnel deployment is rarely able to `--build`.
#
# EVERY ingress, Caddy or not, must forward X-Forwarded-Proto. The API builds its
# absolute OIDC URLs (authorize, end_session, discovery) from it.
#
# Usage — pick exactly ONE edge profile (`direct` or `pangolin`); without a
# profile the stack starts with no ingress and nothing reaches the apps:
#   cd docker
#   cp .env.production.example .env.production    # edit credentials
#
# Direct mode (Caddy owns :80/:443 on this host, provisions TLS itself):
#   docker compose -f docker-compose.production.yml --env-file .env.production \
#     --profile direct up --build
#
# Tunnel mode (no open ports; a Pangolin instance terminates TLS and reaches
# the apps through the newt client — see the newt service below):
#   docker compose -f docker-compose.production.yml --env-file .env.production \
#     --profile pangolin up --build
#
# With observability (Grafana + Alloy), add: --profile observability
#   (profiles stack; repeat the flag)
# =============================================================================

configs:
  pg-hba:
    content: |
      # TYPE  DATABASE  USER  ADDRESS  METHOD
      local   all       all            trust
      host    all       all   all      scram-sha-256
      host    replication all all      scram-sha-256

services:
  # ============================================
  # DATABASE (Primary)
  # ============================================
  postgres:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-postgres
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=4
      -c hot_standby=on
      -c hba_file=/etc/postgresql/pg_hba.conf
    configs:
      - source: pg-hba
        target: /etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.production.example)}
      # Fail-closed HERE ONLY, deliberately. A missing required variable aborts the
      # whole `docker compose config` parse regardless of which service names it, so
      # one `:?` per secret is the entire guarantee — the other three connection
      # strings below can stay plain ${POSTGRES_PASSWORD} without weakening it, and
      # repeating the message at every site would only make the file harder to read.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (generate with `openssl rand -hex 32`)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.production.example)}
      # postgres:18+ moved the default data dir to /var/lib/postgresql/<major>/docker.
      # Pin the pre-18 path so the existing volume layout keeps working.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wallow
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # DATABASE (Read Replica)
  # ============================================
  postgres-replica:
    image: ghcr.io/bc-solutions-coder/wallow-postgres-replica:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-postgres-replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PRIMARY_HOST: postgres
      # Match the primary and the replica entrypoint's data dir (pre-18 path).
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wallow
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # CACHE + SIGNALR BACKPLANE (Valkey)
  # ============================================
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-valkey
    # Fail-closed on VALKEY_PASSWORD here only — see the postgres service for why one
    # site is the whole guarantee. The message avoids ": " because a plain YAML scalar
    # containing colon-space is a mapping, not a string.
    command:
      "valkey-server --appendonly yes --requirepass ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required
      (generate with `openssl rand -hex 32` — it is interpolated into a redis:// URL, so hex not base64)}
      --maxmemory 256mb --maxmemory-policy volatile-lru"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wallow
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # OBJECT STORAGE (GarageHQ — S3-compatible)
  # ============================================
  garage:
    image: ghcr.io/bc-solutions-coder/wallow-garage:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-garage
    environment:
      # All four fail closed — an empty RPC secret or admin token would come up as a
      # cluster anyone on the network can administer, and an empty access/secret key
      # silently yields an API that cannot store a single file. See the postgres
      # service for why one `:?` per variable is the whole guarantee.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is required (generate with `openssl rand -hex 32`)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is required (generate with `openssl rand -hex 32`)}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY:?GARAGE_ACCESS_KEY is required (`GK` + exactly 24 hex chars)}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY:?GARAGE_SECRET_KEY is required (exactly 64 hex chars)}
      GARAGE_KEY_NAME: ${GARAGE_KEY_NAME:-wallow}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-wallow-files}
      GARAGE_REGION: ${GARAGE_REGION:-us-east-1}
      # Container-internal ports, deliberately NOT env-configurable. Garage publishes
      # nothing to the host in this stack; every consumer reaches it as garage:3900 over
      # the private bridge network, so the only thing a knob here could do is desync this
      # value from wallow-api's Storage__S3__Endpoint below.
      GARAGE_S3_PORT: "3900"
      GARAGE_ADMIN_PORT: "3903"
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD-SHELL", "garage status 2>/dev/null | grep -q ID"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - wallow
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # OBSERVABILITY (optional — use --profile observability)
  # ============================================
  alloy:
    image: grafana/alloy:latest
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:12345/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wallow
    restart: unless-stopped
    profiles: ["observability"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  grafana-lgtm:
    image: grafana/otel-lgtm:0.8.1
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-grafana-lgtm
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # The ONE secret in this file that cannot fail closed, and the reason is a Compose
      # limitation rather than a choice: interpolation runs over the whole file before
      # profiles are applied, so a `${GF_ADMIN_PASSWORD:?...}` here would abort `up` for
      # every deployment that never enables the observability profile. Verified, not
      # assumed. The default is therefore a placeholder rather than `admin` — same
      # weakness, but not the one credential pair every scanner tries first. Dev's
      # compose CAN use `:?` because its Grafana is not profile-gated.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-CHANGE_ME_GF_ADMIN_PASSWORD}
    depends_on:
      - alloy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wallow
    restart: unless-stopped
    profiles: ["observability"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================
  # WALLOW MIGRATIONS
  # ============================================
  wallow-migrations:
    image: ghcr.io/bc-solutions-coder/wallow-migrations:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-migrations
    restart: on-failure
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wallow
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # WALLOW SEEDER
  # ============================================
  wallow-seeder:
    image: ghcr.io/bc-solutions-coder/wallow-seeder:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-seeder
    restart: on-failure
    volumes:
      # Self-contained production seed. Fully replaces the image-bundled seed.json
      # (see SEED_FILE_PATH) so dev/localhost client definitions never leak in.
      # Host path is configurable so servers can store the (gitignored) seed file
      # outside the compose directory. Defaults to ./seed.production.json for local runs.
      - ${SEED_FILE_HOST_PATH:-./seed.production.json}:/app/seed.production.json:ro
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Load the production seed override instead of the bundled seed.json.
      SEED_FILE_PATH: /app/seed.production.json
      # No Admin__* injection: production deliberately seeds no admin. The first-run setup
      # page (POST /v1/identity/setup/admin) is the canonical way the bootstrap
      # administrator comes into existence on a fresh deployment.
      # Client secrets injected by clientId over seed.production.json (which is
      # deliberately secret-less). Each ClientSecrets__<clientId> value attaches to the
      # seed client with that id — there is no index alignment to maintain, and reordering
      # the "clients" array in the seed file cannot reassign a secret to the wrong client.
      # Every client in seed.production.json must declare "public": true or false explicitly.
      # A secret-less client that does not declare "public": true is a seeder HARD FAIL,
      # so an unset secret variable below aborts the seeder instead of silently registering a
      # public client that issues tokens without authenticating the caller.
      # wallow-web-client is the dashboard client every deployment has, so it fails closed here.
      # A NON-empty secret whose clientId matches no seed client also aborts the seeder — a
      # misconfiguration is never dropped silently. Additional OIDC clients are NOT seeded:
      # create them through the organizations UI (which issues and rotates their secrets). A
      # fork that genuinely must seed an extra client adds it to its seed file plus one
      # ClientSecrets__<clientId> line here, keyed by the new client's id.
      ClientSecrets__wallow-web-client: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required (generate with `openssl rand -hex 32`)}
    depends_on:
      wallow-migrations:
        condition: service_completed_successfully
    networks:
      - wallow
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # WALLOW API — CERT VOLUME INIT
  # ============================================
  # Named volumes are created owned by root; the API container runs as non-root
  # (UID 1654, the .NET 'app' user). This one-shot service sets ownership so the
  # entrypoint can write OpenIddict certificates to the persistent volume.
  api-cert-init:
    image: busybox:1.37
    volumes:
      - api_certs:/certs
    command: chown -R 1654:1654 /certs
    restart: "no"
    networks:
      - wallow

  # ============================================
  # WALLOW API
  # ============================================
  wallow-api:
    image: ghcr.io/bc-solutions-coder/wallow:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-api
    restart: unless-stopped
    # Pangolin blueprint labels (tunnel mode only — read by the newt service
    # through the Docker socket; inert without --profile pangolin). Tunnel mode
    # uses the SUBDOMAIN topology: each app service declares its OWN resource
    # on its own host, so every app serves at its root and the published
    # images work as pulled. That is deliberate — tunnel deployments are
    # typically driven by a pull-only stack manager (Dockhand, Portainer,
    # Komodo), which cannot run the `up --build` that the path-based /auth
    # route requires (see the wallow-auth HAZARD below). Set API_PATH_BASE=
    # (empty) and API_PUBLIC_URL=https://<PANGOLIN_API_DOMAIN>. No rewrite-*
    # keys: nothing is stripped because nothing is prefixed.
    labels:
      pangolin.public-resources.wallow-api.name: Wallow API
      pangolin.public-resources.wallow-api.mode: http
      pangolin.public-resources.wallow-api.full-domain: ${PANGOLIN_API_DOMAIN:-api.wallow.dev}
      pangolin.public-resources.wallow-api.targets[0].hostname: wallow-api
      pangolin.public-resources.wallow-api.targets[0].port: "8080"
      pangolin.public-resources.wallow-api.targets[0].method: http
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /app/App_Data:mode=1777
    volumes:
      - api_certs:/app/certs
    ports:
      # Loopback-bound: the caddy ingress reaches this over the wallow network,
      # not through the host. Published only so you can curl it while debugging.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # PathBase for reverse-proxy path-based routing
      PathBase: ${API_PATH_BASE-/api}
      # OpenIddict certificates (auto-generated on first startup if missing)
      # Both fail closed. These protect the .pfx files written to the api_certs volume on
      # first boot, so an empty value here does not merely weaken them — it bakes the
      # empty password into the generated certificates, and setting a real one later
      # leaves the API unable to read its own signing key.
      OpenIddict__SigningCertPath: /app/certs/signing.pfx
      OpenIddict__SigningCertPassword: ${OPENIDDICT_SIGNING_CERT_PASSWORD:?OPENIDDICT_SIGNING_CERT_PASSWORD is required (generate with `openssl rand -hex 32`)}
      OpenIddict__EncryptionCertPath: /app/certs/encryption.pfx
      OpenIddict__EncryptionCertPassword: ${OPENIDDICT_ENCRYPTION_CERT_PASSWORD:?OPENIDDICT_ENCRYPTION_CERT_PASSWORD is required (generate with `openssl rand -hex 32`)}
      # TLS terminates at the reverse proxy in front of this stack, and the BFF reaches
      # OIDC discovery over the private network (http://wallow-api:8080), so the OIDC
      # endpoints must be allowed to answer plain HTTP. Outside development this is
      # off by default; set it to "false" if Kestrel ever serves HTTPS directly.
      OpenIddict__AllowPlainHttpEndpoints: "${OPENIDDICT_ALLOW_PLAIN_HTTP_ENDPOINTS:-true}"
      # Migrations
      CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Database
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__ReadReplicaConnection: "Host=postgres-replica;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "valkey:6379,password=${VALKEY_PASSWORD},abortConnect=false"
      # SMTP
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: "${SMTP_PORT}"
      Smtp__UseSsl: "${SMTP_USE_SSL:-true}"
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD:?SMTP_PASSWORD is required (the Notifications module cannot send mail without it)}
      Smtp__DefaultFromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__DefaultFromName: ${SMTP_FROM_NAME}
      # S3 Storage (GarageHQ)
      Storage__Provider: S3
      # Constant, matching the garage service's fixed internal port above.
      Storage__S3__Endpoint: http://garage:3900
      Storage__S3__AccessKey: ${GARAGE_ACCESS_KEY}
      Storage__S3__SecretKey: ${GARAGE_SECRET_KEY}
      Storage__S3__BucketName: ${GARAGE_BUCKET:-wallow-files}
      Storage__S3__UsePathStyle: "true"
      Storage__S3__Region: ${GARAGE_REGION:-us-east-1}
      # Fork branding: the server-side guard reserving the platform's own name as a client
      # display name. A rebranded fork sets this to match packages/styles/branding.json appName.
      Branding__AppName: ${WALLOW_APP_NAME:-Wallow}
      # Service URLs (public-facing, what browsers see)
      ServiceUrls__ApiUrl: ${API_PUBLIC_URL:-https://wallow.dev/api}
      ServiceUrls__AuthUrl: ${AUTH_PUBLIC_URL:-https://wallow.dev/auth}
      ServiceUrls__WebUrl: ${WEB_PUBLIC_URL:-https://wallow.dev}
      # The issuer is the public auth URL, path prefix included: the auth app same-origin
      # proxies /connect/** and /.well-known/** to the API, so browser-facing OIDC endpoints
      # live under it. Registered applications are told the same value.
      OpenIddict__Issuer: ${AUTH_PUBLIC_URL:-https://wallow.dev/auth}
      AuthUrl: ${AUTH_PUBLIC_URL:-https://wallow.dev/auth}
      Authentication__CookieDomain: ${COOKIE_DOMAIN:-wallow.dev}
      # OpenTelemetry (active only when --profile observability is used;
      # Alloy listens on the Docker network, no port mapping needed)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: wallow-api
      # Head-based trace sampling: parent-based ratio sampler. 1.0 would export every trace and
      # flood the collector; a sampled upstream trace still stays sampled end-to-end.
      OpenTelemetry__TraceSamplingRatio: ${OTEL_TRACE_SAMPLING_RATIO:-0.1}
      # Identity / JWT. Fails closed: an empty signing key is not a broken deployment
      # that refuses to start, it is a working one issuing tokens anybody can forge.
      Identity__SigningKey: ${IDENTITY_SIGNING_KEY:?IDENTITY_SIGNING_KEY is required (generate with `openssl rand -hex 48`)}
    depends_on:
      api-cert-init:
        condition: service_completed_successfully
      wallow-seeder:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F90' /proc/net/tcp /proc/net/tcp6 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - wallow
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # WALLOW AUTH
  # ============================================
  wallow-auth:
    image: ghcr.io/bc-solutions-coder/wallow-auth:${VERSION:-latest}
    # HAZARD — path-based routing REQUIRES building this image locally.
    # AUTH_BASE_PATH is a BUILD input: `vite build` bakes the prefix into every
    # emitted asset URL and into the SSR router basepath, so it cannot be set at
    # runtime. The published ghcr.io image is built at ROOT (the CI workflow
    # .github/workflows/deploy.yml passes no AUTH_BASE_PATH, deliberately — the
    # E2E stack and the subdomain topology both need a root-mounted image), which
    # means `docker compose pull && up -d` yields an auth container that 404s
    # behind the /auth ingress route. `up --build` is therefore the documented
    # invocation for the default path-based topology: it rebuilds this service
    # with the prefix and tags it over the pulled name.
    # For subdomain routing, set AUTH_BASE_PATH= (empty) and the pulled image is
    # correct as-is — no --build needed.
    build:
      context: ..
      dockerfile: apps/wallow-auth/Dockerfile
      args:
        AUTH_BASE_PATH: ${AUTH_BASE_PATH-/auth}
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-auth
    restart: unless-stopped
    # Pangolin blueprint labels — see the wallow-api service. Own resource on
    # its own host: with AUTH_BASE_PATH= (empty) the pulled root-built image is
    # exactly right and tunnel mode never needs `up --build`. Set
    # AUTH_PUBLIC_URL=https://<PANGOLIN_AUTH_DOMAIN> to match.
    labels:
      pangolin.public-resources.wallow-auth.name: Wallow Auth
      pangolin.public-resources.wallow-auth.mode: http
      pangolin.public-resources.wallow-auth.full-domain: ${PANGOLIN_AUTH_DOMAIN:-auth.wallow.dev}
      pangolin.public-resources.wallow-auth.targets[0].hostname: wallow-auth
      pangolin.public-resources.wallow-auth.targets[0].port: "8080"
      pangolin.public-resources.wallow-auth.targets[0].method: http
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      # Loopback-bound — see the wallow-api service for why.
      - "127.0.0.1:${AUTH_PORT:-8081}:8080"
    environment:
      NODE_ENV: production
      # The Node SSR host (apps/wallow-auth) listens on PORT; keep it at 8080 so
      # the port mapping and the :1F90 (hex 8080) healthcheck below stay valid.
      PORT: "8080"
      # Upstream for the /v1/**, /connect/**, /.well-known/** reverse proxy
      # (container-to-container). The app is a pure reverse proxy — no session,
      # no Redis; it reads only PORT and HOST (the Nitro server bundle) plus this.
      WALLOW_API_INTERNAL_URL: http://wallow-api:8080
      # OpenTelemetry — see wallow-web below for why this is 4318 and not 4317.
      # Without it the /logs route still accepts batches and answers 204, but the
      # records go to this container's stdout instead of the collector. There is no
      # OTEL_SERVICE_NAME beside it on purpose: the ingest handler stamps the record's
      # service itself (log-ingest.server.ts), so the env var would name nothing.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      # Whose X-Forwarded-For this app believes. `private` = every unroutable
      # range, which is the right answer here: Caddy reaches these containers over
      # a bridge network whose subnet the runtime assigns, so the value names the
      # class rather than an address. Without it every user behind Caddy shares one
      # rate-limit bucket at the API and every forwarded client IP is Caddy's.
      # Narrow it to a CIDR list if your ingress has a fixed address, and NEVER
      # name a range you do not control — a trusted peer's chain is believed.
      # Caddy keeps its own separate `trusted_proxies`; both notes are in
      # docker/caddy/Caddyfile.example, and the full rules are in
      # docs/operations/reverse-proxy.md.
      WALLOW_TRUSTED_PROXIES: ${WALLOW_TRUSTED_PROXIES:-private}
      # The fork's outbound links, rendered into the page (footer attribution
      # here, nav/footer in wallow-web). Optional: unset falls back to
      # packages/styles/branding.json, so a fork that edited that file need set
      # neither. Set them to point ONE deployment at its own repository/docs
      # without rebuilding the image.
      WALLOW_REPOSITORY_URL: ${WALLOW_REPOSITORY_URL:-}
      WALLOW_DOCS_URL: ${WALLOW_DOCS_URL:-}
      # Where a sign-in with no returnUrl lands — the first-run administrator
      # coming straight from /setup, or anyone who opened the login page
      # directly. Unset, the page shows its signed-in banner and stops.
      WALLOW_WEB_URL: ${WEB_PUBLIC_URL:-https://wallow.dev}
    depends_on:
      wallow-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F90' /proc/net/tcp /proc/net/tcp6 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wallow
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # WALLOW WEB
  # ============================================
  wallow-web:
    image: ghcr.io/bc-solutions-coder/wallow-web:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-web
    restart: unless-stopped
    # Pangolin blueprint labels — see the wallow-api service. The apex resource
    # (WEB_PUBLIC_URL). Deliberately absent keys on all three resources:
    #   site       — each resource lands on whatever site the applying newt
    #                belongs to, so the labels work on any fork's Pangolin;
    #   path/rewrite-* — host routing only; nothing is prefixed or stripped;
    #   auth.*     — Wallow does its own authentication; a Pangolin SSO gate
    #                in front would break the OIDC flows.
    labels:
      pangolin.public-resources.wallow.name: Wallow
      pangolin.public-resources.wallow.mode: http
      pangolin.public-resources.wallow.full-domain: ${PANGOLIN_RESOURCE_DOMAIN:-wallow.dev}
      pangolin.public-resources.wallow.targets[0].hostname: wallow-web
      pangolin.public-resources.wallow.targets[0].port: "8080"
      pangolin.public-resources.wallow.targets[0].method: http
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      # Loopback-bound — see the wallow-api service for why.
      - "127.0.0.1:${WEB_PORT:-8082}:8080"
    environment:
      NODE_ENV: production
      # The Node BFF listens on PORT; keep it at 8080 so the port mapping and the
      # :1F90 (hex 8080) healthcheck below stay valid.
      PORT: "8080"
      # OIDC config for the BFF (apps/wallow-web/server.ts -> loadBffConfigFromEnv)
      # Issuer = the public auth URL the API advertises (must match `iss` in tokens)
      OIDC_ISSUER: ${AUTH_PUBLIC_URL:-https://wallow.dev/auth}
      # Metadata = container-to-container discovery URL (avoids hairpin through the proxy)
      OIDC_METADATA_URL: http://wallow-api:8080/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${WEB_PUBLIC_URL:-https://wallow.dev}/bff/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: ${WEB_PUBLIC_URL:-https://wallow.dev}/
      # Downstream API for the /api reverse proxy (container-to-container)
      BFF_API_BASE_URL: http://wallow-api:8080
      # Seals/encrypts the BFF session cookie (min 32 chars). Always set — it is the
      # single-key case and the fallback when no rotation is in progress.
      COOKIE_PASSWORD: ${BFF_COOKIE_PASSWORD:?BFF_COOKIE_PASSWORD is required (32+ char secret; see .env.production.example)}
      # ROTATION. Optional; when set it supersedes COOKIE_PASSWORD for sealing. A JSON
      # object of key ID to secret, whose FIRST key seals new cookies while the rest stay
      # valid for unsealing — so a rotation costs no user their session. Each secret must
      # be 32+ chars and each key ID letters/digits/underscores and not all-digits (the
      # SDK validates all of that at boot, in packages/sdk/src/server/config.ts).
      # On the FIRST rotation the outgoing secret must keep the key ID "default": a bare
      # COOKIE_PASSWORD seals with an empty key ID that unseals as the literal "default",
      # so any other ID for the current value invalidates every live session the moment
      # this is set. Later rotations may use any allowed ID, because by then every cookie
      # in the wild carries one.
      #   BFF_COOKIE_PASSWORDS='{"v2":"<new 64-hex>","default":"<previous>"}'
      # Redeploy, let the old cookies age out past SESSION_TTL_SECONDS, then drop "default".
      COOKIE_PASSWORDS: ${BFF_COOKIE_PASSWORDS:-}
      # The rest of the SDK's cookie/session contract. All five are optional and
      # passed unconditionally BECAUSE they are optional: the SDK reads an empty
      # value as unset for every one of them, so a blank here means "take the
      # default" rather than "set it to nothing". Naming them is what puts them in
      # front of a fork — they reach a deployment whether or not it knows they
      # exist, and until this block they were reachable only by reading SDK source.
      # It is also what lets `pnpm lint:env` see them: that check walks compose
      # ${VAR} references, so a knob no compose file mentions is invisible to it.
      #
      # COOKIE_SECURE / COOKIE_HOST_PREFIX fail SECURE — only the literal string
      # `false` clears either one. Clear them only for a plain-HTTP deployment;
      # `__Host-` additionally requires Secure, so turning off COOKIE_SECURE drops
      # the prefix with it.
      COOKIE_SECURE: ${BFF_COOKIE_SECURE:-}
      COOKIE_HOST_PREFIX: ${BFF_COOKIE_HOST_PREFIX:-}
      # Default `__Host-wallow_bff`, or `wallow_bff` when either flag above is off.
      # Override it when two Wallow deployments share one origin: `__Host-` forces
      # path=/, so their session cookies would otherwise collide on the name.
      COOKIE_NAME: ${BFF_COOKIE_NAME:-}
      # Default 86400 (24h). A malformed value throws at boot rather than falling
      # back, so a typo cannot quietly halve your session lifetime.
      SESSION_TTL_SECONDS: ${BFF_SESSION_TTL_SECONDS:-}
      # Space-separated. Default `openid profile email offline_access`; dropping
      # offline_access costs you refresh tokens, and with them silent renewal.
      OIDC_SCOPES: ${BFF_OIDC_SCOPES:-}
      # Server-side sessions in Valkey so logout truly revokes tokens
      REDIS_URL: "redis://:${VALKEY_PASSWORD}@valkey:6379"
      # OpenTelemetry — 4318, not 4317. @bc-solutions-coder/logger POSTs OTLP/JSON
      # over HTTP and has no gRPC transport; 4317 is Alloy's gRPC receiver and the
      # POST just fails there, silently (a valid batch answers 204 either way).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      # No OTEL_SERVICE_NAME: see wallow-auth above. Nothing in the Node path reads
      # it — the ingest handler stamps the record's service from its own constant —
      # so naming one here would only read as if it were load-bearing.
      # See the wallow-auth service above — same trusted-proxy list, same reason.
      WALLOW_TRUSTED_PROXIES: ${WALLOW_TRUSTED_PROXIES:-private}
      # See the wallow-auth service above — same two optional links.
      WALLOW_REPOSITORY_URL: ${WALLOW_REPOSITORY_URL:-}
      WALLOW_DOCS_URL: ${WALLOW_DOCS_URL:-}
      # Where the branding editor's "Preview sign-in" link points: the sign-in
      # app's public origin, which is the same value the API advertises.
      WALLOW_AUTH_URL: ${AUTH_PUBLIC_URL:-https://wallow.dev/auth}
    depends_on:
      wallow-api:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F90' /proc/net/tcp /proc/net/tcp6 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wallow
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # INGRESS (Caddy — direct mode, --profile direct)
  # ============================================
  # The externally reachable service in DIRECT mode. Terminates TLS and does
  # the path routing the three app services above assume (/api and /auth
  # prefixes KEPT, everything else to wallow-web). Routing lives in
  # caddy/Caddyfile.example; copy it to caddy/Caddyfile and point
  # CADDYFILE_HOST_PATH at your edited copy rather than editing the committed
  # example.
  #
  # Profile-gated so a `--profile pangolin` deployment does not also bind this
  # host's :80/:443 — pick ONE edge per deployment. Running your own ingress
  # instead? Start neither profile and target the 127.0.0.1 ports the app
  # services publish (API_PORT / AUTH_PORT / WEB_PORT).
  caddy:
    image: caddy:2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${INGRESS_HTTP_PORT:-80}:80"
      - "${INGRESS_HTTPS_PORT:-443}:443"
      # QUIC/HTTP3 — Caddy serves it alongside 443/tcp once TLS is on.
      - "${INGRESS_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ${CADDYFILE_HOST_PATH:-./caddy/Caddyfile.example}:/etc/caddy/Caddyfile:ro
      # Persist issued certificates and OCSP staples; without this volume Caddy
      # re-requests certificates on every restart and will hit Let's Encrypt
      # rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      wallow-api:
        condition: service_healthy
      wallow-auth:
        condition: service_healthy
      wallow-web:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, NOT localhost: Caddy's admin API binds IPv4 only, while
      # localhost resolves to ::1 first inside the container — the healthcheck
      # gets ECONNREFUSED and the service never turns healthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wallow
    profiles: ["direct"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # PANGOLIN TUNNEL (tunnel mode — use --profile pangolin)
  # ============================================
  # Newt, the Pangolin tunnel client, for deployments fronted by a Pangolin
  # instance (typically on a VPS, terminating TLS) instead of exposing this
  # host's :80/:443 directly. Running it HERE, as part of the stack, is
  # load-bearing twice over:
  #
  #   - It joins the `wallow` network, so it proxies to the app services by
  #     container DNS name (wallow-api, ...), which survive restarts. A newt
  #     running on the HOST (e.g. as a systemd unit) can never resolve those
  #     names and falls back to bridge IPs, which the runtime reassigns on
  #     every recreate — the classic "Pangolin breaks after a restart".
  #     Disable any host-level newt using the same site credentials; two newts
  #     on one site steal the tunnel from each other.
  #   - It mounts the Docker socket, so it reads the `pangolin.*` BLUEPRINT
  #     labels on wallow-api / wallow-auth / wallow-web (see those services)
  #     and creates/updates the three host-based Pangolin resources itself.
  #     Nothing is configured by hand in the dashboard, and labels are applied
  #     continuously — this file is the source of truth, and dashboard edits
  #     to the labelled resources get overwritten.
  #
  # In this mode Pangolin routes by HOST (api./auth./apex — the subdomain
  # topology above), so the caddy service stays down (it is behind --profile
  # direct) and no host ports are bound at all — newt only dials out.
  # Pangolin's proxy sends X-Forwarded-Proto: https straight to the apps;
  # WALLOW_TRUSTED_PROXIES=private on the Node apps already covers newt's
  # bridge address, so no trusted-proxy changes are needed.
  #
  # SECURITY — the Docker socket is root-equivalent access to this host, and
  # `:ro` only makes the socket file read-only, not the API behind it. That is
  # the price of label discovery; to narrow it, put tecnativa/docker-socket-proxy
  # in between and point DOCKER_SOCKET at it.
  #
  # Stack managers that make per-deploy profile flags awkward can run this
  # same service as its own compose project instead — docker-compose.pangolin.yml
  # (one newt per site, never both; see that file's header).
  newt:
    image: fosrl/newt:latest
    container_name: ${COMPOSE_PROJECT_NAME:-wallow}-newt
    restart: unless-stopped
    environment:
      # All three come from the site's config in the Pangolin dashboard.
      # They cannot fail closed (`:?`) — the service is profile-gated and
      # interpolation runs before profiles apply, the same Compose limitation
      # documented on GF_ADMIN_PASSWORD above. Unset, newt exits and restarts;
      # it cannot come up insecure.
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:-}
      NEWT_ID: ${NEWT_ID:-}
      NEWT_SECRET: ${NEWT_SECRET:-}
      # Newt touches this file while the tunnel is up; the healthcheck reads it.
      HEALTH_FILE: /tmp/healthy
      # Enables container discovery + the pangolin.* blueprint labels above.
      DOCKER_SOCKET: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/healthy ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - wallow
    profiles: ["pangolin"]
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  postgres_replica_data:
  valkey_data:
  garage_meta:
  garage_data:
  api_certs:
  caddy_data:
  caddy_config:

networks:
  wallow:
    driver: bridge
