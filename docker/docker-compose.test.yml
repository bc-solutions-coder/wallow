# docker-compose.test.yml
# Test environment - extends base infrastructure with application services
# Uses separate ports and volume namespace to avoid conflicts with dev environment
#
# The explicit project name keeps this stack in a different Compose project from
# the dev-infra stack (docker-compose.yml). Without it, this file resolves the
# project directory to docker/ and picks up COMPOSE_PROJECT_NAME=wallow from
# docker/.env, and `down --remove-orphans` then removes the running dev-infra
# containers as orphans (Wallow-kd2e). NOTE: an environment (or docker/.env)
# COMPOSE_PROJECT_NAME still outranks this field — scripts/e2e.sh therefore also
# passes --project-name wallow-test explicitly. If you invoke this file by hand
# with COMPOSE_PROJECT_NAME set, pass -p wallow-test yourself.
#
# Every host port and the URLs that embed one interpolate ${E2E_*_PORT:-<classic
# default>}, and every image tag interpolates ${E2E_IMAGE_TAG:-test} — run by
# hand you get exactly the classic values; scripts/e2e.sh exports per-run values
# so concurrent runs cannot collide (Wallow-joo0). The knob list lives in
# .env.example.
name: wallow-test

services:
  # ============================================
  # INFRASTRUCTURE (from base compose)
  # ============================================
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wallow_test
      POSTGRES_PASSWORD: wallow_test
      POSTGRES_DB: wallow_test
      # postgres:18+ moved the default data dir; pin the pre-18 path for the volume.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallow_test -d wallow_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wallow-test

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes --requirepass WallowTestValkey123!
    ports:
      - "127.0.0.1:${E2E_VALKEY_PORT:-6389}:6379"
    volumes:
      - test_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "WallowTestValkey123!", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wallow-test

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "127.0.0.1:${E2E_MAILPIT_SMTP_PORT:-1035}:1025"
      - "127.0.0.1:${E2E_MAILPIT_HTTP_PORT:-8035}:8025"
    networks:
      - wallow-test

  garage:
    image: wallow-garage:${E2E_IMAGE_TAG:-test}
    build:
      context: ./images/garage
    environment:
      GARAGE_RPC_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      GARAGE_ADMIN_TOKEN: test-admin-token
      GARAGE_KEY_NAME: wallow-test
      GARAGE_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_BUCKET: wallow-test-files
    volumes:
      - test_garage_meta:/var/lib/garage/meta
      - test_garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:${E2E_GARAGE_S3_PORT:-3910}:3900"
      - "127.0.0.1:${E2E_GARAGE_ADMIN_PORT:-3913}:3903"
    healthcheck:
      test: ["CMD", "garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wallow-test

  # ============================================
  # MIGRATIONS
  # ============================================
  wallow-migrations:
    image: wallow-migrations:${E2E_IMAGE_TAG:-test}
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=wallow_test;Username=wallow_test;Password=wallow_test"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wallow-test

  # ============================================
  # SEEDER
  # ============================================
  wallow-seeder:
    image: wallow-seeder:${E2E_IMAGE_TAG:-test}
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=wallow_test;Username=wallow_test;Password=wallow_test"
      # Override wallow-web-client redirect URIs for the test port. The client is
      # now a Node BFF (apps/wallow-web), so the callback is /bff/callback, not the
      # Blazor /signin-oidc middleware path. Clients__<index>__ addresses api/seed.json's
      # clients array by POSITION; wallow-web-client is index 0 there.
      Clients__0__RedirectUris__0: "http://localhost:${E2E_WEB_PORT:-5053}/bff/callback"
      Clients__0__PostLogoutRedirectUris__0: "http://localhost:${E2E_WEB_PORT:-5053}/"
      # bff-example-client (seed.json clients index 1) hardcodes localhost:3003; rebase it
      # onto this run's bff-example host port so the external-origin consent spec
      # still round-trips when scripts/e2e.sh randomizes ports (Wallow-joo0).
      Clients__1__RedirectUris__0: "http://localhost:${E2E_BFF_PORT:-3003}/bff/callback"
      Clients__1__PostLogoutRedirectUris__0: "http://localhost:${E2E_BFF_PORT:-3003}/"
      Clients__1__FrontchannelLogoutUri: "http://localhost:${E2E_BFF_PORT:-3003}/bff/frontchannel-logout"
      # PROTOTYPE (#127): back-channel logout is the API POSTing to the RP, so
      # the registered URI is the CONTAINER hostname, not localhost. Real once
      # #115's seed field exists.
      #Clients__1__BackchannelLogoutUri: "http://bff-example:3010/bff/backchannel-logout"
      # First-run setup coverage: scripts/e2e.sh blanks this for the initial seed
      # (a blank Admin__Email leaves AdminBootstrapOptions unconfigured, so the
      # bootstrap step is skipped and the stack comes up with setupRequired=true
      # for the wallow-auth first-run journey), then restores it for a second
      # seeder pass that attaches the journey-created admin to the seeded
      # organization's memberships. The dash (not ":-") keeps an explicit empty
      # value empty; unset (plain `docker compose up`) falls back to seed.json's
      # admin exactly as before.
      Admin__Email: ${E2E_SEED_ADMIN_EMAIL-admin@wallow.dev}
    depends_on:
      wallow-migrations:
        condition: service_completed_successfully
    networks:
      - wallow-test

  # ============================================
  # APPLICATION SERVICES
  # ============================================
  wallow-api:
    image: wallow-api:${E2E_IMAGE_TAG:-test}
    ports:
      - "${E2E_API_PORT:-5050}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Override HTTPS_PORT from appsettings.Development.json to prevent HTTPS redirect
      HTTPS_PORT: ""
      CONNECTION_STRING: "Host=postgres;Port=5432;Database=wallow_test;Username=wallow_test;Password=wallow_test"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=wallow_test;Username=wallow_test;Password=wallow_test"
      ConnectionStrings__Redis: "valkey:6379,password=WallowTestValkey123!,abortConnect=false"
      OPENIDDICT_SIGNING_CERT_PASSWORD: test-signing
      OPENIDDICT_ENCRYPTION_CERT_PASSWORD: test-encryption
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Storage__Provider: S3
      Storage__S3__Endpoint: "http://garage:3900"
      Storage__S3__AccessKey: GK0123456789abcdef01234567
      Storage__S3__SecretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      Storage__S3__BucketName: wallow-test-files
      Storage__S3__UsePathStyle: "true"
      Storage__S3__Region: us-east-1
      # Auth URL for link generation (browser-accessible from host)
      AuthUrl: "http://localhost:${E2E_AUTH_PORT:-5051}"
      ServiceUrls__AuthUrl: "http://localhost:${E2E_AUTH_PORT:-5051}"
      # API URL for link generation (browser-accessible from host, e.g. magic link emails)
      ServiceUrls__ApiUrl: "http://localhost:${E2E_API_PORT:-5050}"
      # Fix OIDC issuer so browser-facing tokens match the authority clients expect (localhost)
      OpenIddict__Issuer: "http://localhost:${E2E_API_PORT:-5050}"
      # wallow-web is a BFF; treat its client as first-party so the OIDC flow
      # skips the interactive consent screen during the dashboard login. This
      # override is POSITIONAL: appsettings declares an empty FirstPartyClients
      # array, so it starts at index 0 and must be renumbered whenever that
      # array (or this override list) gains or loses an entry.
      #
      # bff-example-client (the external-origin reference client, api/seed.json) is
      # DELIBERATELY ABSENT here. It used to be listed too, to skip consent for
      # it as well -- a workaround dating from when the consent screen was
      # broken (design doc Sec 14.3). Plan Sec 5.5.1/5.5.2 fixed the screen
      # (seeded scope descriptions, scp:* client permissions), and bff-example-client
      # exists specifically to exercise the THIRD-PARTY consent path
      # (Wallow-yp3e.4, plan 5.5.6) -- treating it as first-party here made this
      # stack the one place that path could never be verified, while the
      # Aspire stack's FirstPartyClients: [] never had this override at all.
      Identity__FirstPartyClients__0: "wallow-web-client"
    tmpfs:
      - /tmp
      - /app/App_Data
      - /app/certs
    depends_on:
      wallow-seeder:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      garage:
        condition: service_healthy
      # Passwordless flows deliver magic-link / OTP mail over SMTP to Mailpit, which
      # the e2e email specs read back over its HTTP API on :8035. Without this edge
      # `up --wait wallow-api` never starts Mailpit (it is otherwise a leaf), the
      # API's SMTP send silently fails, and magic-link.spec.ts / otp-login.spec.ts
      # get ECONNREFUSED on :8035. Mailpit has no healthcheck, so gate on start.
      mailpit:
        condition: service_started
    networks:
      - wallow-test

  # apps/wallow-auth (TanStack Start SSR + reverse proxy), not the legacy Blazor
  # Wallow.Auth image. Build context is the repo root so the Dockerfile can build
  # the @bc-solutions-coder/sdk workspace dependency alongside the app.
  #
  # The image tag is deliberately distinct from the legacy wallow-auth:test so a
  # stale Blazor image can never be silently reused for this service.
  #
  # This app is a PURE reverse proxy, not a BFF: it holds no session and no cookie
  # jar, so it needs none of the Blazor app's ASPNETCORE_*/ServiceUrls__*/Redis
  # configuration. It reads exactly three env vars — PORT and HOST (the Nitro
  # server bundle) and WALLOW_API_INTERNAL_URL (the SDK passthrough the
  # src/routes/{v1,connect,[.]well-known}/$.ts server routes call).
  wallow-auth:
    image: wallow-auth-react:${E2E_IMAGE_TAG:-test}
    build:
      context: ..
      dockerfile: apps/wallow-auth/Dockerfile
    # Host port is E2E_AUTH_PORT (classic default 5051, the E2E stack's auth
    # URL); the container port is 3002, this app's Node port, not the Blazor 8080.
    ports:
      - "127.0.0.1:${E2E_AUTH_PORT:-5051}:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3002"
      # Upstream for the /v1/**, /connect/**, /.well-known/** reverse proxy
      # (container-to-container).
      WALLOW_API_INTERNAL_URL: "http://wallow-api:8080"
    # node:24-slim ships no curl/wget, so liveness is probed with node's own fetch.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      - wallow-api
    networks:
      - wallow-test

  # apps/wallow-web (TanStack Start SSR + BFF tunnel), not the legacy Blazor
  # Wallow.Web image. Build context is the repo root so the Dockerfile can build
  # the @bc-solutions-coder/sdk workspace dependency alongside the app.
  #
  # The image tag is deliberately distinct from the legacy wallow-web:test so a
  # stale Blazor image can never be silently reused for this service. This tag
  # (wallow-web-react:test) MUST match the tag ci.yml builds/saves/loads;
  # otherwise compose rebuilds the image from scratch at runtime instead of
  # reusing the cached one.
  #
  # This is the same Node BFF host as bff-example, but authenticates as the
  # seeded wallow-web-client (the canonical dashboard client) rather than the
  # bff-example-client reference client. The OIDC issuer/metadata split mirrors
  # bff-example (browser-facing issuer vs container-reachable discovery URL).
  wallow-web:
    image: wallow-web-react:${E2E_IMAGE_TAG:-test}
    build:
      context: ..
      dockerfile: apps/wallow-web/Dockerfile
    ports:
      - "127.0.0.1:${E2E_WEB_PORT:-5053}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3000"
      # Browser-facing issuer (must match API OpenIddict issuer for redirects)
      OIDC_ISSUER: "http://localhost:${E2E_API_PORT:-5050}"
      # Server-reachable discovery URL (container -> host-published API)
      OIDC_METADATA_URL: "http://host.docker.internal:${E2E_API_PORT:-5050}/.well-known/openid-configuration"
      OIDC_CLIENT_ID: wallow-web-client
      OIDC_CLIENT_SECRET: wallow-web-secret
      OIDC_REDIRECT_URI: "http://localhost:${E2E_WEB_PORT:-5053}/bff/callback"
      OIDC_POST_LOGOUT_REDIRECT_URI: "http://localhost:${E2E_WEB_PORT:-5053}/"
      # Downstream API for the /api proxy (container-to-container)
      BFF_API_BASE_URL: "http://wallow-api:8080"
      COOKIE_PASSWORD: "e2e-web-cookie-seal-password-min-32-chars"
      # Safari/WebKit refuses Secure cookies over plain-HTTP localhost (Chrome and Firefox
      # allow them), so the BFF's login-transaction cookie never survives the redirect and
      # every /bff/callback fails with a 400. This stack is plain HTTP, so drop the flag here.
      COOKIE_SECURE: "false"
      # Server-side sessions in Valkey so logout truly revokes (see bff-example).
      REDIS_URL: "redis://:WallowTestValkey123!@valkey:6379"
    # node:24-slim ships no curl/wget, so liveness is probed with node's own fetch.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3010/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      - wallow-api
      - wallow-auth
      - valkey
    networks:
      - wallow-test

  # ============================================
  # EXTERNAL RELYING-PARTY EXAMPLE (apps/minimal-app) — PROTOTYPE #127
  # ============================================
  # The "some other site built on the published SDK" origin the cross-app suite
  # drives. It no longer wears wallow-web's image with a different client id:
  # apps/minimal-app IS an external RP — depends on nothing but
  # @bc-solutions-coder/sdk, mounts /bff + /api, keeps sessions in Valkey.
  #
  # OIDC issuer vs discovery-metadata split (mirrors wallow-web):
  #   - OIDC_ISSUER = http://localhost:$E2E_API_PORT is the browser-facing issuer
  #     origin (matches the API's OpenIddict issuer), used to build
  #     authorize/end-session redirect URLs the browser follows.
  #   - OIDC_METADATA_URL = http://host.docker.internal:$E2E_API_PORT/... is the
  #     server-reachable discovery URL. The SDK uses the discovered
  #     token_endpoint verbatim (it rewrites nothing) -- the API derives its
  #     endpoints from the request base, so discovery fetched through this URL
  #     already returns a backchannel endpoint the container can reach for code
  #     exchange and silent refresh.
  bff-example:
    image: wallow-bff-example:${E2E_IMAGE_TAG:-test}
    build:
      context: ..
      dockerfile: apps/minimal-app/Dockerfile
    ports:
      - "${E2E_BFF_PORT:-3003}:3010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3010"
      # Browser-facing issuer (must match API OpenIddict issuer for redirects)
      OIDC_ISSUER: "http://localhost:${E2E_API_PORT:-5050}"
      # Server-reachable discovery URL (container -> host-published API).
      # The SDK uses this metadata's token_endpoint for the backchannel and pins
      # the browser-facing authorize/end-session endpoints to OIDC_ISSUER.
      OIDC_METADATA_URL: "http://host.docker.internal:${E2E_API_PORT:-5050}/.well-known/openid-configuration"
      OIDC_CLIENT_ID: bff-example-client
      OIDC_CLIENT_SECRET: bff-example-secret
      OIDC_REDIRECT_URI: "http://localhost:${E2E_BFF_PORT:-3003}/bff/callback"
      OIDC_POST_LOGOUT_REDIRECT_URI: "http://localhost:${E2E_BFF_PORT:-3003}/"
      # bff-example-client (api/seed.json) is provisioned for these scopes beyond the SDK's
      # default openid/profile/email/offline_access -- request all of them so the consent
      # screen this client exists to exercise actually renders their descriptions instead of
      # silently falling back to the default set (AuthorizationController.cs only grants
      # scopes that were both requested AND registered on the client).
      OIDC_SCOPES: "openid profile email offline_access roles inquiries.read inquiries.write notifications.read notifications.write"
      # Downstream API for the /api proxy (container-to-container)
      BFF_API_BASE_URL: "http://wallow-api:8080"
      COOKIE_PASSWORD: "e2e-bff-cookie-seal-password-min-32-chars"
      # Safari/WebKit refuses Secure cookies over plain-HTTP localhost (Chrome and Firefox
      # allow them), so the BFF's login-transaction cookie never survives the redirect and
      # every /bff/callback fails with a 400. This stack is plain HTTP, so drop the flag here.
      COOKIE_SECURE: "false"
      # Server-side sessions in Valkey: the cookie becomes an opaque ref and the
      # tokens live in Valkey, so logout truly revokes. Without this the example
      # falls back to the stateless cookie store.
      REDIS_URL: "redis://:WallowTestValkey123!@valkey:6379"
    # node:24-slim ships no curl/wget, so liveness is probed with node's own fetch.
    # Same image/route surface as wallow-web, so the identical /health probe applies.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      - wallow-api
      - wallow-auth
      - valkey
    networks:
      - wallow-test

volumes:
  test_postgres_data:
  test_valkey_data:
  test_garage_meta:
  test_garage_data:

networks:
  wallow-test:
    driver: bridge
