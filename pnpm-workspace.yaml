packages:
  # Every app is a direct child of apps/. There is deliberately no grouping
  # directory: `apps/*` + `!apps/examples` + `apps/examples/*` reads fine to
  # pnpm but turbo applies the negation as a directory-prefix exclusion, so the
  # re-include never fires and the nested app silently drops out of every turbo
  # task — a build that stops running and reports nothing.
  - "apps/*"
  - "packages/*"

# esbuild's postinstall only re-links a binary its platform-specific optional
# dependency already provides, so it stays off -- the whole build/typecheck/test
# gate runs Vite, and therefore esbuild, green without it. pnpm 11 promoted an
# ignored build script from a warning to a hard install error, so the decision
# has to be written down rather than left implicit the way pnpm 10 allowed.
allowBuilds:
  esbuild: false

catalogs:
  # Exact pins. App-side runtime singletons: two copies at runtime is a broken app,
  # not a slow one. Bump these together, deliberately, in one commit.
  start:
    "@tanstack/react-start": 1.168.32
    "@tanstack/react-router": 1.170.18
    "@tanstack/react-router-ssr-query": 1.167.1
  # Ranges. What packages/* declare as peers and use in devDependencies.
  react:
    react: ^19.2.7
    react-dom: ^19.2.7
    "@tanstack/react-form": ^1.33.2
    "@tanstack/react-query": ^5.101.2
    zustand: ^5.0.8
  # Exact pin. The compiler is a build-wide singleton in the way that matters:
  # two members on different tsc versions disagree about what typechecks, and the
  # failure surfaces as an inexplicable diff between `pnpm typecheck` and an
  # editor. Every workspace member references this, so a bump is one edit here.
  tooling:
    typescript: 7.0.2

# The pinned Hey API prerelease requires vulnerable js-yaml 5.2.0.
overrides:
  "@hey-api/json-schema-ref-parser>js-yaml": 5.4.1
