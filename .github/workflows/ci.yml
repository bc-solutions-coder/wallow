name: CI

on:
  pull_request:
    branches: [main]

# Default for jobs without their own permissions block (unit-tests,
# integration-tests, merge-coverage); other jobs declare their own.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Classifies the PR's paths once; jobs gate on the outputs. `code` is
  # everything except docs — a docs-only PR skips the whole pipeline via
  # build's gate (docker/e2e inherit through `needs: build`). `dotnet` and
  # `js` gate only the test-side jobs: build/docker/e2e must run for BOTH
  # sides because e2e boots the full stack from this PR's images.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Load-bearing, and NOT the default: under the default `some`, a
          # negated pattern is inert — `code`'s `'**'` would match a docs-only
          # PR's markdown and the gate would never fire. `some-with-excludes`
          # is the only quantifier that reads `!` as an exclusion while leaving
          # the negation-free `dotnet`/`js` filters behaving as plain
          # any-of lists (`every` would demand a file match all four of
          # `dotnet`'s patterns at once, making it permanently false).
          predicate-quantifier: "some-with-excludes"
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            dotnet:
              - 'api/**'
              - 'global.json'
              - 'scripts/e2e.sh'
              - '.github/workflows/ci.yml'
            js:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.npmrc'
              - 'scripts/fork-smoke.sh'
              - '.github/workflows/ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore previous build output
        uses: actions/cache/restore@v6
        with:
          path: |
            **/bin/Release
            **/obj
          key: build-v3-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-v3-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx

      - name: Build
        run: dotnet build api/Wallow.slnx --no-restore --configuration Release --graph

      - name: Check code formatting
        run: dotnet format api/Wallow.slnx --verify-no-changes --no-restore

      - name: Cache build output
        uses: actions/cache/save@v6
        with:
          path: |
            **/bin/Release
            **/obj
          key: build-v3-${{ runner.os }}-${{ github.sha }}

  unit-tests:
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore build output
        uses: actions/cache/restore@v6
        with:
          path: |
            **/bin/Release
            **/obj
          key: build-v3-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx

      - name: Run unit tests
        run: dotnet test api/Wallow.slnx --no-build --configuration Release --filter "Category!=Integration&Category!=E2E" --verbosity normal --blame-hang-timeout 60s --collect "XPlat Code Coverage" --settings api/tests/coverage.runsettings --results-directory ./TestResults

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 5

  integration-tests:
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wallow
          POSTGRES_PASSWORD: wallow
          POSTGRES_DB: wallow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Start Valkey with password
        run: |
          docker run -d --name valkey -p 6379:6379 valkey/valkey:8-alpine \
            valkey-server --requirepass WallowTestValkey123! --appendonly yes
          for i in $(seq 1 10); do
            if docker exec valkey valkey-cli -a WallowTestValkey123! ping 2>/dev/null | grep -q PONG; then
              echo "Valkey is ready"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "::error::Valkey did not become healthy in time"
              docker logs valkey
              exit 1
            fi
            sleep 1
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore build output
        uses: actions/cache/restore@v6
        with:
          path: |
            **/bin/Release
            **/obj
          key: build-v3-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx

      - name: Run integration tests
        run: dotnet test api/Wallow.slnx --no-build --configuration Release --filter "Category=Integration" --verbosity normal --blame-hang-timeout 5m --collect "XPlat Code Coverage" --settings api/tests/coverage.runsettings --results-directory ./TestResults
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=wallow_test;Username=wallow;Password=wallow"
          Redis__ConnectionString: "localhost:6379,password=WallowTestValkey123!,abortConnect=false"

      - name: Upload integration test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 5

  # Tenant isolation is the control a fork most needs to inherit intact (OWASP API1:2023), so it
  # runs as its own blocking job: a broken tenant filter reads as "cross-tenant tests failed"
  # rather than as one red line inside the general sweep. The filter selects by trait, not by
  # project, because the change that most needs the gate is a module adding its first
  # tenant-scoped resource. Half the suite is Category=Integration, so the job supplies the same
  # Postgres and Valkey the integration-tests job does and does NOT exclude that category.
  cross-tenant-tests:
    needs: [changes, build]
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wallow
          POSTGRES_PASSWORD: wallow
          POSTGRES_DB: wallow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Start Valkey with password
        run: |
          docker run -d --name valkey -p 6379:6379 valkey/valkey:8-alpine \
            valkey-server --requirepass WallowTestValkey123! --appendonly yes
          for i in $(seq 1 10); do
            if docker exec valkey valkey-cli -a WallowTestValkey123! ping 2>/dev/null | grep -q PONG; then
              echo "Valkey is ready"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "::error::Valkey did not become healthy in time"
              docker logs valkey
              exit 1
            fi
            sleep 1
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore build output
        uses: actions/cache/restore@v6
        with:
          path: |
            **/bin/Release
            **/obj
          key: build-v3-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx

      - name: Run cross-tenant isolation tests
        run: dotnet test api/Wallow.slnx --no-build --configuration Release --filter "Category=CrossTenant" --verbosity normal --blame-hang-timeout 5m --settings api/tests/coverage.runsettings --results-directory ./TestResults
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=wallow_test;Username=wallow;Password=wallow"
          Redis__ConnectionString: "localhost:6379,password=WallowTestValkey123!,abortConnect=false"

  docker-images-app:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore build output
        uses: actions/cache/restore@v6
        with:
          path: |
            **/bin/Release
            **/obj
          key: build-v3-${{ runner.os }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx

      # The arm64 app images below are cross-built on the amd64 runner; register
      # QEMU binfmt handlers so their Dockerfile RUN steps can execute arm64
      # binaries (without this, buildx fails with "exec format error").
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Publish app container images
        run: |
          # x64 images for E2E testing on ubuntu runner
          dotnet publish api/src/Wallow.Api/Wallow.Api.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test \
            -p:ContainerRuntimeIdentifier=linux-x64
          # wallow-auth is the React BFF (apps/wallow-auth/Dockerfile), not Blazor
          # Wallow.Auth. The build context is the repo root so the Dockerfile can
          # resolve the @bc-solutions-coder/sdk workspace dependency. Tag matches the
          # docker-compose.test.yml wallow-auth service (wallow-auth-react:test) so the
          # e2e job loads this image instead of rebuilding it.
          docker build -f apps/wallow-auth/Dockerfile -t wallow-auth-react:test .
          # wallow-web is the React BFF (apps/wallow-web/Dockerfile), not Blazor
          # Wallow.Web. The build context is the repo root so the Dockerfile can
          # resolve the @bc-solutions-coder/sdk workspace dependency. Tag matches the
          # docker-compose.test.yml wallow-web service (wallow-web-react:test) so the
          # e2e job loads this image instead of rebuilding it.
          docker build -f apps/wallow-web/Dockerfile -t wallow-web-react:test .
          dotnet publish api/src/Wallow.MigrationService/Wallow.MigrationService.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test \
            -p:ContainerRuntimeIdentifier=linux-x64
          dotnet publish api/src/Wallow.SeederService/Wallow.SeederService.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test \
            -p:ContainerRuntimeIdentifier=linux-x64

          # arm64 images for multi-arch push
          dotnet publish api/src/Wallow.Api/Wallow.Api.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test-arm64 \
            -p:ContainerRuntimeIdentifier=linux-arm64
          # wallow-auth arm64 image via buildx (single-platform --load so the
          # subsequent docker save can archive it alongside the .NET images).
          docker buildx build --platform linux/arm64 --load \
            -f apps/wallow-auth/Dockerfile -t wallow-auth-react:test-arm64 .
          # wallow-web arm64 image via buildx (single-platform --load so the
          # subsequent docker save can archive it alongside the .NET images).
          docker buildx build --platform linux/arm64 --load \
            -f apps/wallow-web/Dockerfile -t wallow-web-react:test-arm64 .
          dotnet publish api/src/Wallow.MigrationService/Wallow.MigrationService.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test-arm64 \
            -p:ContainerRuntimeIdentifier=linux-arm64
          dotnet publish api/src/Wallow.SeederService/Wallow.SeederService.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test-arm64 \
            -p:ContainerRuntimeIdentifier=linux-arm64

      - name: Save app images to cache
        run: |
          docker save \
            wallow-api:test wallow-api:test-arm64 \
            wallow-auth-react:test wallow-auth-react:test-arm64 \
            wallow-web-react:test wallow-web-react:test-arm64 \
            wallow-migrations:test wallow-migrations:test-arm64 \
            wallow-seeder:test wallow-seeder:test-arm64 \
            | gzip > /tmp/wallow-images-app.tar.gz

      - name: Cache app images
        uses: actions/cache/save@v6
        with:
          path: /tmp/wallow-images-app.tar.gz
          key: images-app-${{ github.sha }}

  docker-images-infra:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Build infra images
        run: |
          docker compose -f docker/docker-compose.test.yml build garage
          docker build -t wallow-postgres-replica:latest docker/images/postgres-replica

      - name: Save infra images to cache
        run: |
          docker save \
            wallow-garage:test wallow-postgres-replica:latest \
            | gzip > /tmp/wallow-images-infra.tar.gz

      - name: Cache infra images
        uses: actions/cache/save@v6
        with:
          path: /tmp/wallow-images-infra.tar.gz
          key: images-infra-${{ github.sha }}

  e2e-tests:
    needs: [docker-images-app, docker-images-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Restore app images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/wallow-images-app.tar.gz
          key: images-app-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Restore infra images
        uses: actions/cache/restore@v6
        with:
          path: /tmp/wallow-images-infra.tar.gz
          key: images-infra-${{ github.sha }}
          fail-on-cache-miss: true

      # docker-images-app / docker-images-infra already built and cached the
      # wallow-api / wallow-auth-react / migration / seeder / garage :test images,
      # so the e2e job loads them instead of rebuilding (E2E_SKIP_IMAGE_BUILD=1).
      - name: Load Docker images
        run: |
          gunzip -c /tmp/wallow-images-app.tar.gz | docker load
          gunzip -c /tmp/wallow-images-infra.tar.gz | docker load

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ubuntu-latest runners have no Playwright browser cache; install Chromium
      # (and its OS deps) before running the suites. One install covers wallow-auth
      # and wallow-web: they pin the same @playwright/test version, so both resolve
      # the same shared per-version browser cache.
      - name: Install Playwright browser
        run: pnpm --filter ./apps/wallow-auth exec playwright install --with-deps chromium

      # Serve wallow-auth from its prebuilt container and drive it directly — no
      # local dev server: e2e.sh infers the container's per-run URL from
      # E2E_UP_SERVICE=wallow-auth (Wallow-joo0). The runner brings up the
      # compose stack (including wallow-web), waits for the API + seeded admin,
      # then runs all three suites — wallow-auth, wallow-web, and the cross-app
      # login journey, which gates the full login + authenticated mutation +
      # logout loop — and tears the stack down.
      - name: Run E2E suites
        env:
          E2E_SKIP_IMAGE_BUILD: "1"
          E2E_UP_SERVICE: wallow-auth
        run: ./scripts/e2e.sh

      - name: Upload wallow-auth Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-wallow-auth
          path: apps/wallow-auth/playwright-report
          if-no-files-found: ignore
          retention-days: 5

      # Both wallow-web suites (playwright.config.ts and playwright.cross-app.config.ts)
      # write into the same apps/wallow-web/playwright-report directory, so one upload
      # covers them.
      - name: Upload wallow-web Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-wallow-web
          path: apps/wallow-web/playwright-report
          if-no-files-found: ignore
          retention-days: 5

  # A fork consumes @bc-solutions-coder/* as published tarballs, not as workspace
  # symlinks — so nothing in the workspace build can catch a file missing from
  # `files`, an `exports` subpath that points at a path `pnpm pack` never ships,
  # a runtime dependency parked under devDependencies, or a .d.ts that references
  # a type left behind. This job installs the packed tarballs into a scratch
  # TanStack Start app outside the workspace, which is exactly that install.
  #
  # Needs only `changes` (not build) — it touches no .NET output and can run
  # alongside the build; it gates on the js filter because a pure-api PR
  # cannot change what `pnpm pack` ships.
  fork-smoke:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # Installs the workspace so the script can BUILD packages/sdk and
      # packages/styles; the scratch app itself installs nothing from here.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The work directory is pinned outside the checkout (the script refuses to
      # run inside the repo — there pnpm would find the workspace root walking
      # up and the app would stop being an outside consumer). Spelled out rather
      # than left to the script's mktemp default because runners do not set
      # TMPDIR, so the default would land in /tmp instead of the runner's own
      # scratch space.
      - name: Build a scratch app from the packed SDK
        env:
          FORK_SMOKE_DIR: ${{ runner.temp }}/fork-smoke
        run: ./scripts/fork-smoke.sh

  merge-coverage:
    needs: [unit-tests, integration-tests]
    if: always() && (needs.unit-tests.result == 'success' || needs.integration-tests.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Download unit test coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-unit
          path: ./coverage/unit
        continue-on-error: true

      - name: Download integration test coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-integration
          path: ./coverage/integration
        continue-on-error: true

      - name: Check for coverage files
        id: check-coverage
        run: |
          FILES=$(find ./coverage -name "coverage.cobertura.xml" -type f 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "::warning::No coverage artifacts were produced by test jobs. Coverage reporting skipped."
            echo "has_coverage=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found coverage files:"
            echo "$FILES"
            echo "has_coverage=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ReportGenerator
        if: steps.check-coverage.outputs.has_coverage == 'true'
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Merge coverage reports
        if: steps.check-coverage.outputs.has_coverage == 'true'
        run: reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage/merged" -reporttypes:"Cobertura;HtmlSummary"

      - name: Enforce coverage threshold
        if: steps.check-coverage.outputs.has_coverage == 'true'
        run: |
          LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' ./coverage/merged/Cobertura.xml | head -1)
          if [ -z "$LINE_RATE" ]; then
            echo "::error::Failed to extract line-rate from Cobertura.xml"
            exit 1
          fi
          PERCENT=$(awk "BEGIN {printf \"%.1f\", ${LINE_RATE} * 100}")
          echo "Line coverage: ${PERCENT}%"
          MIN=90
          if [ "$(awk "BEGIN {print (${LINE_RATE} * 100 < $MIN)}")" = "1" ]; then
            echo "::error::Coverage ${PERCENT}% is below minimum threshold of ${MIN}%"
            exit 1
          fi

      - name: Upload merged coverage report
        if: steps.check-coverage.outputs.has_coverage == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage/merged
          retention-days: 30
