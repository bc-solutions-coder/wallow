name: CI
"on":
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: 0 6 * * 1
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      route: ${{ steps.route.outputs.route }}
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: route
        name: Classify complete change set
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/validation.py classify --event "$EVENT" --base "$BASE" --head "$HEAD"
      - id: profile
        name: Select security profile
        env:
          SECURITY_PROFILE: ${{ vars.SECURITY_PROFILE }}
        run: python3 scripts/ci/security.py profile
  build:
    needs: changes
    if: needs.changes.outputs.route == 'full'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx
      - name: Build
        run: dotnet build api/Wallow.slnx --no-restore --configuration Release --graph
      - name: Check code formatting
        run: dotnet format api/Wallow.slnx --verify-no-changes --no-restore
      - name: Archive exact build output
        run: |-
          mkdir -p .ci-artifacts/dotnet
          find api -type d \( -path '*/bin/Release' -o -name obj \) -prune -print0 | tar --null -T - -czf .ci-artifacts/dotnet/output.tar.gz
          python3 scripts/ci/validation.py seal --file .ci-artifacts/dotnet/output.tar.gz --manifest .ci-artifacts/dotnet/output.tar.gz.json --kind dotnet --variant release
      - name: Upload dotnet-build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dotnet-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/dotnet
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
    timeout-minutes: 30
  unit-tests:
    needs:
      - changes
      - build
    if: needs.changes.outputs.route == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Download dotnet-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dotnet-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/dotnet
      - name: Verify and extract build output
        run: |-
          python3 scripts/ci/validation.py verify --file .ci-artifacts/dotnet/output.tar.gz --manifest .ci-artifacts/dotnet/output.tar.gz.json --kind dotnet --variant release
          tar -xzf .ci-artifacts/dotnet/output.tar.gz
      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx
      - name: Run unit tests
        run:
          dotnet test api/Wallow.slnx --no-build --configuration Release --filter "Category!=Integration&Category!=E2E" --verbosity
          normal --blame-hang-timeout 60s --collect "XPlat Code Coverage" --settings api/tests/coverage.runsettings --results-directory
          ./TestResults
      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7
    timeout-minutes: 30
  integration-tests:
    needs:
      - changes
      - build
    if: needs.changes.outputs.route == 'full'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wallow
          POSTGRES_PASSWORD: wallow
          POSTGRES_DB: wallow_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start Valkey with password
        run: |
          docker run -d --name valkey -p 6379:6379 valkey/valkey:8-alpine \
            valkey-server --requirepass WallowTestValkey123! --appendonly yes
          for i in $(seq 1 10); do
            if docker exec valkey valkey-cli -a WallowTestValkey123! ping 2>/dev/null | grep -q PONG; then
              echo "Valkey is ready"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "::error::Valkey did not become healthy in time"
              docker logs valkey
              exit 1
            fi
            sleep 1
          done
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Download dotnet-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dotnet-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/dotnet
      - name: Verify and extract build output
        run: |-
          python3 scripts/ci/validation.py verify --file .ci-artifacts/dotnet/output.tar.gz --manifest .ci-artifacts/dotnet/output.tar.gz.json --kind dotnet --variant release
          tar -xzf .ci-artifacts/dotnet/output.tar.gz
      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx
      - name: Run integration tests
        run:
          dotnet test api/Wallow.slnx --no-build --configuration Release --filter "Category=Integration" --verbosity normal
          --blame-hang-timeout 5m --collect "XPlat Code Coverage" --settings api/tests/coverage.runsettings --results-directory
          ./TestResults
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=wallow_test;Username=wallow;Password=wallow
          Redis__ConnectionString: localhost:6379,password=WallowTestValkey123!,abortConnect=false
      - name: Upload integration test coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7
    timeout-minutes: 30
  cross-tenant-tests:
    needs:
      - changes
      - build
    if: needs.changes.outputs.route == 'full'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wallow
          POSTGRES_PASSWORD: wallow
          POSTGRES_DB: wallow_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Start Valkey with password
        run: |
          docker run -d --name valkey -p 6379:6379 valkey/valkey:8-alpine \
            valkey-server --requirepass WallowTestValkey123! --appendonly yes
          for i in $(seq 1 10); do
            if docker exec valkey valkey-cli -a WallowTestValkey123! ping 2>/dev/null | grep -q PONG; then
              echo "Valkey is ready"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "::error::Valkey did not become healthy in time"
              docker logs valkey
              exit 1
            fi
            sleep 1
          done
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Download dotnet-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dotnet-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/dotnet
      - name: Verify and extract build output
        run: |-
          python3 scripts/ci/validation.py verify --file .ci-artifacts/dotnet/output.tar.gz --manifest .ci-artifacts/dotnet/output.tar.gz.json --kind dotnet --variant release
          tar -xzf .ci-artifacts/dotnet/output.tar.gz
      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx
      - name: Run cross-tenant isolation tests
        run:
          dotnet test api/Wallow.slnx --no-build --configuration Release --filter "Category=CrossTenant" --verbosity normal
          --blame-hang-timeout 5m --settings api/tests/coverage.runsettings --results-directory ./TestResults
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=wallow_test;Username=wallow;Password=wallow
          Redis__ConnectionString: localhost:6379,password=WallowTestValkey123!,abortConnect=false
    timeout-minutes: 30
  docker-images-app:
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Download dotnet-build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dotnet-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/dotnet
      - name: Verify and extract build output
        run: |-
          python3 scripts/ci/validation.py verify --file .ci-artifacts/dotnet/output.tar.gz --manifest .ci-artifacts/dotnet/output.tar.gz.json --kind dotnet --variant release
          tar -xzf .ci-artifacts/dotnet/output.tar.gz
      - name: Restore dependencies
        run: dotnet restore api/Wallow.slnx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
        with:
          platforms: arm64
      - name: Publish app container images
        run: |
          # x64 images for E2E testing on ubuntu runner
          dotnet publish api/src/Wallow.Api/Wallow.Api.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test \
            -p:ContainerRuntimeIdentifier=linux-x64
          # wallow-auth is the React BFF (apps/wallow-auth/Dockerfile), not Blazor
          # Wallow.Auth. The build context is the repo root so the Dockerfile can
          # resolve the @bc-solutions-coder/sdk workspace dependency. Tag matches the
          # docker-compose.test.yml wallow-auth service (wallow-auth-react:test) so the
          # e2e job loads this image instead of rebuilding it.
          docker build -f apps/wallow-auth/Dockerfile -t wallow-auth-react:test .
          # wallow-web is the React BFF (apps/wallow-web/Dockerfile), not Blazor
          # Wallow.Web. The build context is the repo root so the Dockerfile can
          # resolve the @bc-solutions-coder/sdk workspace dependency. Tag matches the
          # docker-compose.test.yml wallow-web service (wallow-web-react:test) so the
          # e2e job loads this image instead of rebuilding it.
          docker build -f apps/wallow-web/Dockerfile -t wallow-web-react:test .
          # bff-example is the external relying-party example (apps/minimal-app/
          # Dockerfile), built here so the e2e job with E2E_SKIP_IMAGE_BUILD=1
          # loads it instead of compose rebuilding it uncached. Test-only image:
          # nothing deploys it, so no arm64 variant.
          docker build -f apps/minimal-app/Dockerfile -t wallow-bff-example:test .
          dotnet publish api/src/Wallow.MigrationService/Wallow.MigrationService.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test \
            -p:ContainerRuntimeIdentifier=linux-x64
          dotnet publish api/src/Wallow.SeederService/Wallow.SeederService.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test \
            -p:ContainerRuntimeIdentifier=linux-x64

          # arm64 images for multi-arch push
          dotnet publish api/src/Wallow.Api/Wallow.Api.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test-arm64 \
            -p:ContainerRuntimeIdentifier=linux-arm64
          # wallow-auth arm64 image via buildx (single-platform --load so the
          # subsequent docker save can archive it alongside the .NET images).
          docker buildx build --platform linux/arm64 --load \
            -f apps/wallow-auth/Dockerfile -t wallow-auth-react:test-arm64 .
          # wallow-web arm64 image via buildx (single-platform --load so the
          # subsequent docker save can archive it alongside the .NET images).
          docker buildx build --platform linux/arm64 --load \
            -f apps/wallow-web/Dockerfile -t wallow-web-react:test-arm64 .
          dotnet publish api/src/Wallow.MigrationService/Wallow.MigrationService.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test-arm64 \
            -p:ContainerRuntimeIdentifier=linux-arm64
          dotnet publish api/src/Wallow.SeederService/Wallow.SeederService.csproj \
            -c Release --no-build /t:PublishContainer \
            -p:ContainerImageTag=test-arm64 \
            -p:ContainerRuntimeIdentifier=linux-arm64
      - name: Archive app images
        run: |-
          mkdir -p .ci-artifacts/images-app
          docker save \
            wallow-api:test wallow-api:test-arm64 \
            wallow-auth-react:test wallow-auth-react:test-arm64 \
            wallow-web-react:test wallow-web-react:test-arm64 \
            wallow-bff-example:test \
            wallow-migrations:test wallow-migrations:test-arm64 \
            wallow-seeder:test wallow-seeder:test-arm64 \
            | gzip > .ci-artifacts/images-app/images.tar.gz

          python3 scripts/ci/validation.py seal --file .ci-artifacts/images-app/images.tar.gz --manifest .ci-artifacts/images-app/images.tar.gz.json --kind images --variant app-amd64-arm64
      - name: Upload images-app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: images-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/images-app
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
    if: needs.changes.outputs.route == 'full'
  docker-images-infra:
    needs:
      - changes
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
        with:
          platforms: arm64
      - name: Build infra images
        run: |
          docker compose -f docker/docker-compose.test.yml build garage
          docker build -t wallow-postgres-replica:latest docker/images/postgres-replica

          docker buildx build --platform linux/arm64 --load -t wallow-garage:test-arm64 docker/images/garage
          docker buildx build --platform linux/arm64 --load -t wallow-postgres-replica:test-arm64 docker/images/postgres-replica
      - name: Archive infra images
        run: |-
          mkdir -p .ci-artifacts/images-infra
          docker save \
            wallow-garage:test wallow-postgres-replica:latest wallow-garage:test-arm64 wallow-postgres-replica:test-arm64 \
            | gzip > .ci-artifacts/images-infra/images.tar.gz

          python3 scripts/ci/validation.py seal --file .ci-artifacts/images-infra/images.tar.gz --manifest .ci-artifacts/images-infra/images.tar.gz.json --kind images --variant infra-amd64-arm64
      - name: Upload images-infra
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: images-infra-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/images-infra
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
    timeout-minutes: 30
    if: needs.changes.outputs.route == 'full'
  e2e-tests:
    needs:
      - docker-images-app
      - docker-images-infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download images-app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: images-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/images-app
      - name: Download images-infra
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: images-infra-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/images-infra
      - name: Load Docker images
        run: |-
          python3 scripts/ci/validation.py verify --file .ci-artifacts/images-app/images.tar.gz --manifest .ci-artifacts/images-app/images.tar.gz.json --kind images --variant app-amd64-arm64
          gunzip -c .ci-artifacts/images-app/images.tar.gz | docker load
          python3 scripts/ci/validation.py verify --file .ci-artifacts/images-infra/images.tar.gz --manifest .ci-artifacts/images-infra/images.tar.gz.json --kind images --variant infra-amd64-arm64
          gunzip -c .ci-artifacts/images-infra/images.tar.gz | docker load
      - name: Enable corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter ./apps/wallow-auth exec playwright install --with-deps chromium
      - name: Run E2E suites
        env:
          E2E_SKIP_IMAGE_BUILD: "1"
          E2E_UP_SERVICE: wallow-auth
        run: ./scripts/e2e.sh
      - name: Upload wallow-auth Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-wallow-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/wallow-auth/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload wallow-web Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-wallow-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/wallow-web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
    timeout-minutes: 30
  merge-coverage:
    needs:
      - changes
      - unit-tests
      - integration-tests
    if: needs.changes.outputs.route == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Download unit test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./coverage/unit
      - name: Download integration test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./coverage/integration
      - name: Check for coverage files
        id: check-coverage
        run: |-
          for suite in unit integration; do
            test -n "$(find "./coverage/$suite" -name coverage.cobertura.xml -type f -print -quit)" || { echo "::error::Missing $suite coverage"; exit 1; }
          done
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
      - name: Merge coverage reports
        run: reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage/merged" -reporttypes:"Cobertura;HtmlSummary"
      - name: Enforce coverage threshold
        run: python3 scripts/ci/coverage_gate.py ./coverage/merged/Cobertura.xml
      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./coverage/merged
          retention-days: 7
    timeout-minutes: 30
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download verified actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
      - name: Test CI contracts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Install workflow policy parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Enforce immutable action references
        run: python3 scripts/ci/action_policy.py
      - name: Validate publication catalog
        run: python3 scripts/ci/publication.py catalog
      - name: Validate CI policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/ci/security.py policy
    needs: changes
    timeout-minutes: 10
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Enable corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install DocFX test dependencies
        run: pnpm install --frozen-lockfile --filter @bc-solutions-coder/testing
      - name: Install Playwright browser
        run: pnpm --filter ./packages/testing exec playwright install --with-deps chromium
      - name: Generate theme CSS
        run: |
          mkdir -p docfx/templates/wallow/public
          node scripts/generate-docs-theme.mjs packages/styles/branding.json
      - name: Restore tools and build docs
        run: |
          dotnet restore api/Wallow.slnx
          dotnet tool restore
          dotnet docfx docfx.json
      - name: Test rendered theme contrast
        run: pnpm --filter @bc-solutions-coder/testing test:docfx
      - name: Archive validated site
        run: |-
          mkdir -p .ci-artifacts/docs
          tar -czf .ci-artifacts/docs/site.tar.gz -C .docfx/_site .
          python3 scripts/ci/validation.py seal --file .ci-artifacts/docs/site.tar.gz --manifest .ci-artifacts/docs/site.tar.gz.json --kind docs --variant docfx
      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docfx-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/docs
          if-no-files-found: error
          retention-days: 30
      - name: Set up QEMU for docs package updates
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
        with:
          platforms: arm64
      - name: Package validated docs site
        run: |-
          docker build --platform linux/amd64 -f docker/docs/Dockerfile.ci -t wallow-docs:test .
          docker build --platform linux/arm64 -f docker/docs/Dockerfile.ci -t wallow-docs:test-arm64 .
          mkdir -p .ci-artifacts/images-docs
          docker save wallow-docs:test wallow-docs:test-arm64 | gzip > .ci-artifacts/images-docs/images.tar.gz
          python3 scripts/ci/validation.py seal --file .ci-artifacts/images-docs/images.tar.gz --manifest .ci-artifacts/images-docs/images.tar.gz.json --kind images --variant docs-amd64-arm64
      - name: Upload images-docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: images-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/images-docs
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
    needs: changes
    timeout-minutes: 30
  openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wallow
          POSTGRES_PASSWORD: wallow
          POSTGRES_DB: wallow_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Emit OpenAPI document and detect drift
        id: openapi
        uses: ./.github/actions/openapi-document
        with:
          connection-string: Host=localhost;Port=5432;Database=wallow_test;Username=wallow;Password=wallow
      - name: Prepare generated contract patch
        if: steps.openapi.outputs.drift == 'true'
        env:
          DOCUMENT: ${{ steps.openapi.outputs.document }}
        run: python3 scripts/ci/openapi_patch.py "$DOCUMENT"
      - name: Upload openapi-patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openapi-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/openapi.patch
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
        if: steps.openapi.outputs.drift == 'true'
      - name: Fail on OpenAPI snapshot drift
        if: steps.openapi.outputs.drift == 'true'
        env:
          REASON: ${{ steps.openapi.outputs.reason }}
          DIFF_FILE: ${{ steps.openapi.outputs.diff-file }}
        run: |
          cat "$DIFF_FILE"
          if [ "$REASON" = "servers" ]; then
            echo "::error::packages/sdk/openapi/v1.json declares the wrong servers[0].url."
            echo "::error::Refresh the snapshot against an API served from http://localhost:5001/."
          else
            echo "::error::packages/sdk/openapi/v1.json is out of date with the API contract."
          fi
          echo "::error::Refresh it locally and commit the result:"
          echo "::error::  cd docker && docker compose up -d"
          echo "::error::  dotnet run --project api/src/Wallow.Api"
          echo "::error::  WALLOW_OPENAPI_URL=http://localhost:5001/openapi/v1.json pnpm --filter @bc-solutions-coder/sdk exec tsx scripts/generate.ts"
          echo "::error::  pnpm --filter @bc-solutions-coder/api-errors generate"
          echo "::error::  git add packages/sdk/openapi packages/sdk/src/generated packages/api-errors/src/generated && git commit"
          exit 1
    needs: changes
    if: needs.changes.outputs.route == 'full'
    timeout-minutes: 20
  js:
    needs: changes
    if: needs.changes.outputs.route == 'full'
    uses: ./.github/workflows/js.yml
  codeql:
    needs: changes
    if: needs.changes.outputs.route == 'full' && needs.changes.outputs.profile == 'codeql'
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
  security:
    needs:
      - changes
      - build
      - docker-images-app
      - docker-images-infra
      - docs
      - js
    if:
      always() && needs.docs.result == 'success' && (needs.changes.outputs.route == 'docs' || (needs.changes.outputs.route
      == 'full' && needs.build.result == 'success' && needs.docker-images-app.result == 'success' && needs.docker-images-infra.result
      == 'success' && needs.js.result == 'success'))
    uses: ./.github/workflows/security.yml
    with:
      docs-only: ${{ needs.changes.outputs.route == 'docs' }}
      profile: ${{ needs.changes.outputs.profile }}
  required:
    name: CI / required
    needs:
      - changes
      - policy
      - docs
      - build
      - unit-tests
      - integration-tests
      - cross-tenant-tests
      - docker-images-app
      - docker-images-infra
      - e2e-tests
      - merge-coverage
      - js
      - openapi
      - security
      - codeql
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require complete validation evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
          ROUTE: ${{ needs.changes.outputs.route }}
          PROFILE: ${{ needs.changes.outputs.profile }}
        run:
          python3 scripts/ci/validation.py gate --route "$ROUTE" --profile "$PROFILE" --needs-json "$RESULTS" --common changes,policy,docs,security
          --full build,unit-tests,integration-tests,cross-tenant-tests,docker-images-app,docker-images-infra,e2e-tests,merge-coverage,js,openapi,codeql
  register-publication:
    needs: [changes, required]
    if: >-
      always() && needs.changes.result == 'success' && needs.required.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Register exact validated publication inputs
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE: ${{ needs.changes.outputs.route }}
        run: |
          mkdir .ci-registration
          python3 scripts/ci/registration.py --route "$ROUTE" --output .ci-registration/registration.json
          python3 scripts/ci/validation.py seal --file .ci-registration/registration.json --manifest .ci-registration/registration.json.json --kind registration --variant publication
      - name: Retain immutable producer registration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: producer-registration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-registration/*
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
defaults:
  run:
    shell: bash
env:
  TURBO_CACHE: local:rw
