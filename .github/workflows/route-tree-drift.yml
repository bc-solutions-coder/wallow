name: Route Tree Drift

# Keeps each app's committed src/routeTree.gen.ts in sync with its src/routes/**
# sources. Regenerates all three apps' trees exactly the way a developer would,
# and fails if a committed tree has drifted from what the generator now emits.
#
# Every app is on TanStack Start, which owns route codegen through its vite
# plugin — there is no tsr.config.json and no routes:generate script to call, so
# each tree is emitted as a side effect of `vite build`. That is what a developer
# runs locally, which is the only thing that makes this check actionable.
#
# Route-tree generation is pure JS/TS, so unlike openapi-drift.yml this workflow
# boots no backend: no database, no cache, no .NET runtime.

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/wallow-*/src/routes/**"
      - "apps/wallow-*/src/routeTree.gen.ts"
      - "apps/examples/minimal-app/src/routes/**"
      - "apps/examples/minimal-app/src/routeTree.gen.ts"
      # Each app configures the Start plugin that owns its codegen right here,
      # in its own vite.config.ts — there is no tsr.config.json any more.
      - "apps/wallow-*/vite.config.ts"
      - "apps/examples/minimal-app/vite.config.ts"
      - ".github/workflows/route-tree-drift.yml"
  push:
    branches: [main]
    paths:
      - "apps/wallow-*/src/routes/**"
      - "apps/wallow-*/src/routeTree.gen.ts"
      - "apps/examples/minimal-app/src/routes/**"
      - "apps/examples/minimal-app/src/routeTree.gen.ts"
      # Each app configures the Start plugin that owns its codegen right here,
      # in its own vite.config.ts — there is no tsr.config.json any more.
      - "apps/wallow-*/vite.config.ts"
      - "apps/examples/minimal-app/vite.config.ts"
      - ".github/workflows/route-tree-drift.yml"

concurrency:
  group: route-tree-drift-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Regeneration is a full `vite build` for both apps, and that resolves the
      # @bc-solutions-coder/* workspace packages from their dist output — so they
      # have to be built first or the build dies with UNRESOLVED_IMPORT before it
      # ever writes a route tree.
      - name: Build workspace packages
        run: pnpm --filter './packages/*' build

      # Regenerate every app's tree the same way a developer does.
      - name: Regenerate route trees
        run: |
          pnpm --filter @bc-solutions-coder/wallow-auth build
          pnpm --filter @bc-solutions-coder/wallow-web build
          pnpm --filter @bc-solutions-coder/example-minimal-app build

      - name: Fail on route-tree drift
        run: |
          if ! git diff --exit-code -- \
            apps/wallow-auth/src/routeTree.gen.ts \
            apps/wallow-web/src/routeTree.gen.ts \
            apps/examples/minimal-app/src/routeTree.gen.ts; then
            echo "::error::A committed routeTree.gen.ts is out of date with its src/routes/** sources."
            echo "::error::Regenerate it locally and commit the result:"
            echo "::error::  pnpm --filter @bc-solutions-coder/wallow-auth build"
            echo "::error::  pnpm --filter @bc-solutions-coder/wallow-web build"
            echo "::error::  pnpm --filter @bc-solutions-coder/example-minimal-app build"
            echo "::error::  git add apps/*/src/routeTree.gen.ts apps/examples/minimal-app/src/routeTree.gen.ts && git commit"
            exit 1
          fi
          echo "All route trees are in sync with their sources."
