name: Route Tree Drift

# Keeps each app's committed routeTree.gen.ts in sync with its routes/** sources.
# sources. Regenerates all three apps' trees exactly the way a developer would,
# and fails if a committed tree has drifted from what the generator now emits.
#
# Every app is on TanStack Start, which owns route codegen through its vite
# plugin — there is no tsr.config.json and no routes:generate script to call, so
# each tree is emitted as a side effect of `vite build`. That is what a developer
# runs locally, which is the only thing that makes this check actionable.
#
# Route-tree generation is pure JS/TS, so unlike openapi-drift.yml this workflow
# boots no backend: no database, no cache, no .NET runtime.

on:
  pull_request:
    branches: [main]
    paths:
      # The wallow apps keep everything the Start plugin owns under src/app/;
      # minimal-app is still on the flat src/ layout.
      - "apps/wallow-*/src/app/routes/**"
      - "apps/wallow-*/src/app/routeTree.gen.ts"
      - "apps/minimal-app/src/routes/**"
      - "apps/minimal-app/src/routeTree.gen.ts"
      # Each app configures the Start plugin that owns its codegen right here,
      # in its own vite.config.ts — there is no tsr.config.json any more.
      - "apps/wallow-*/vite.config.ts"
      - "apps/minimal-app/vite.config.ts"
      - ".github/workflows/route-tree-drift.yml"
  push:
    branches: [main]
    paths:
      # The wallow apps keep everything the Start plugin owns under src/app/;
      # minimal-app is still on the flat src/ layout.
      - "apps/wallow-*/src/app/routes/**"
      - "apps/wallow-*/src/app/routeTree.gen.ts"
      - "apps/minimal-app/src/routes/**"
      - "apps/minimal-app/src/routeTree.gen.ts"
      # Each app configures the Start plugin that owns its codegen right here,
      # in its own vite.config.ts — there is no tsr.config.json any more.
      - "apps/wallow-*/vite.config.ts"
      - "apps/minimal-app/vite.config.ts"
      - ".github/workflows/route-tree-drift.yml"

concurrency:
  group: route-tree-drift-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    # Self-hosted turbo remote cache — same contract as js.yml: all three are
    # repository secrets, fork PRs see empty values and run uncached.
    env:
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      # The `secrets` context is not usable inside a step-level `if`; bridged
      # through env as a "true"/"false" string.
      TAILNET_ENABLED: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Join the tailnet as a tagged ephemeral node so turbo can reach the
      # remote cache at its tailnet address. Skipped when the OAuth secrets are
      # absent (fork PRs): turbo then runs local-only.
      - name: Tailscale
        if: env.TAILNET_ENABLED == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Probe the cache endpoint before the first turbo invocation (any HTTP
      # status proves TCP works; normally 401 without a bearer). Non-fatal: a
      # dead cache host degrades to an uncached run, never a red one.
      - name: Wait for the cache host over the tailnet
        if: env.TAILNET_ENABLED == 'true'
        run: |
          host=$(printf '%s' "$TURBO_API" | sed -E 's#^[a-z]+://##; s#[:/].*$##')
          tailscale ping --until-direct=false --timeout 2s -c 10 "$host" > /dev/null 2>&1 || true
          for i in $(seq 1 10); do
            if code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "$TURBO_API/v8/artifacts/status" 2>&1); then
              echo "cache endpoint answered HTTP $code"
              exit 0
            fi
            echo "attempt $i: $code"
            sleep 3
          done
          echo "::warning::turbo cache endpoint unreachable over the tailnet; this run is uncached"

      # One turbo invocation builds the three apps and, via ^build, every
      # @bc-solutions-coder/* package they depend on — replacing the raw
      # `pnpm --filter` builds that bypassed the cache. A remote-cache hit is
      # sound for the drift check: each app's turbo.jsonc declares
      # routeTree.gen.ts as an OUTPUT and excludes it from inputs, so the task
      # hash covers exactly the route sources, and a restored tree is
      # byte-identical to a regenerated one.
      - name: Regenerate route trees
        run: >
          pnpm exec turbo run build
          --filter @bc-solutions-coder/wallow-auth
          --filter @bc-solutions-coder/wallow-web
          --filter @bc-solutions-coder/example-minimal-app

      - name: Fail on route-tree drift
        run: |
          if ! git diff --exit-code -- \
            apps/wallow-auth/src/app/routeTree.gen.ts \
            apps/wallow-web/src/app/routeTree.gen.ts \
            apps/minimal-app/src/routeTree.gen.ts; then
            echo "::error::A committed routeTree.gen.ts is out of date with its routes/** sources."
            echo "::error::Regenerate it locally and commit the result:"
            echo "::error::  pnpm --filter @bc-solutions-coder/wallow-auth build"
            echo "::error::  pnpm --filter @bc-solutions-coder/wallow-web build"
            echo "::error::  pnpm --filter @bc-solutions-coder/example-minimal-app build"
            echo "::error::  git add apps/wallow-*/src/app/routeTree.gen.ts apps/minimal-app/src/routeTree.gen.ts && git commit"
            exit 1
          fi
          echo "All route trees are in sync with their sources."
