name: JS validation
"on":
  workflow_call: {}
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: &id001
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache local Turbo outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: turbo-v2-${{ runner.os }}-${{ github.ref }}-
      - name: Connect main runner to Tailscale
        id: tailnet
        if: env.MAIN_CACHE == 'true' && env.TAILNET_CONFIGURED == 'true'
        continue-on-error: true
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Select available cache
        env:
          TAILNET_RESULT: ${{ steps.tailnet.outcome }}
        run: python3 scripts/ci/cache.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Lint tests
        run: pnpm lint:tests
      - name: Lint manifests
        run: pnpm lint:manifests
      - name: Lint dependency graph
        run: pnpm lint:deps
      - name: Lint environment documentation
        run: pnpm lint:env
      - name: Check generated output
        run: pnpm check:generated
      - name: Check formatting
        run: pnpm format:check
      - name: Install Playwright browser
        run: pnpm --filter ./packages/testing exec playwright install --with-deps chromium
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck
      - name: Check route trees
        run: git diff --exit-code -- apps/wallow-auth/src/app/routeTree.gen.ts apps/wallow-web/src/app/routeTree.gen.ts apps/minimal-app/src/routeTree.gen.ts
      - name: Test
        run: pnpm test
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/**/__screenshots__/**
            apps/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Pack validation candidates once
        run: ./scripts/ci/pack.sh
      - name: Check package export surface
        run: pnpm check:exports
        env:
          CI_PACKAGE_DIR: ${{ github.workspace }}/.ci-artifacts/packages
      - name: Verify external package consumer
        run: pnpm check:external-consumer
        env:
          CI_PACKAGE_DIR: ${{ github.workspace }}/.ci-artifacts/packages
      - name: Verify isolated telemetry artifact
        run: ./scripts/check-telemetry-artifact.sh
        env:
          CI_PACKAGE_DIR: ${{ github.workspace }}/.ci-artifacts/packages
      - name: Verify fork consumer
        env:
          CI_PACKAGE_DIR: ${{ github.workspace }}/.ci-artifacts/packages
          FORK_SMOKE_DIR: ${{ runner.temp }}/fork-smoke
        run: ./scripts/fork-smoke.sh
      - name: Archive validated packages
        run: |-
          tar -czf .ci-artifacts/packages.tar.gz -C .ci-artifacts/packages .
          python3 scripts/ci/validation.py seal --file .ci-artifacts/packages.tar.gz --manifest .ci-artifacts/packages.tar.gz.json --kind packages --variant pnpm
      - name: Upload js-packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: js-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/packages.tar.gz*
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Save generated-file patch
        if: failure()
        run: |-
          mkdir -p .ci-artifacts
          git diff --binary -- packages/sdk/src/generated packages/api-errors/src/generated packages/sdk/openapi apps/wallow-auth/src/app/routeTree.gen.ts apps/wallow-web/src/app/routeTree.gen.ts apps/minimal-app/src/routeTree.gen.ts > .ci-artifacts/generated.patch
      - name: Upload generated-patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-patch-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/generated.patch
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
        if: failure()
    if:
      ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && (github.repository == 'bc-solutions-coder/wallow'
      || vars.ENABLE_MAIN_CACHE == 'true')) }}
    env:
      TURBO_CACHE: local:rw
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps: *id001
    if:
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (github.repository == 'bc-solutions-coder/wallow'
      || vars.ENABLE_MAIN_CACHE == 'true') }}
    environment:
      name: production
      deployment: false
    env:
      MAIN_CACHE: "true"
      TURBO_CACHE: local:rw
      TURBO_API: ${{ secrets.TURBO_API }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      TAILNET_CONFIGURED: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' }}
  complete:
    needs:
      - local
      - main
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected JS execution
        env:
          MAIN_SELECTED:
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (github.repository == 'bc-solutions-coder/wallow'
            || vars.ENABLE_MAIN_CACHE == 'true') }}
          LOCAL_RESULT: ${{ needs.local.result }}
          MAIN_RESULT: ${{ needs.main.result }}
        run: |-
          if [ "$MAIN_SELECTED" = true ]; then
            test "$MAIN_RESULT" = success && test "$LOCAL_RESULT" = skipped
          else
            test "$LOCAL_RESULT" = success && test "$MAIN_RESULT" = skipped
          fi
