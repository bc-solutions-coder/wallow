name: JS CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.jsonc"
      - "scripts/**"
      # Not a JS path, but scripts/check-env.sh reads it: this workflow owns the
      # compose-to-.env.example drift gate, so a compose or example edit alone
      # still has to run it.
      - "docker/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".nvmrc"
      - ".npmrc"
      - ".github/workflows/js.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.jsonc"
      - "scripts/**"
      # Not a JS path, but scripts/check-env.sh reads it: this workflow owns the
      # compose-to-.env.example drift gate, so a compose or example edit alone
      # still has to run it.
      - "docker/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".nvmrc"
      - ".npmrc"
      - ".github/workflows/js.yml"

permissions:
  contents: read

concurrency:
  group: js-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Cap for the Wallow-r6zh post-completion wedge: turbo has been observed to
    # print its complete final summary and then never exit (browser-mode
    # provider suspected, unverified). Without this cap a wedged run burns
    # GitHub's 360-minute default. The full job is minutes warm and well under
    # 20 cold, so 30 is generous headroom, and the wedge prints everything
    # before hanging — a timeout kill loses no log output.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Second oxlint pass: the test and story files `pnpm lint` excludes, with
      # the vitest plugin enabled. See scripts/lint-tests.sh.
      - name: Lint tests
        run: pnpm lint:tests

      # sherif: workspace manifest hygiene (dependency version alignment,
      # ordering, root-manifest shape). Zero-config; the script is the config.
      - name: Lint manifests
        run: pnpm lint:manifests

      # knip: unused files, exports and dependencies. Needs no dist/ — it
      # resolves workspace imports from source, so it runs before the build.
      - name: Lint dependency graph
        run: pnpm lint:deps

      # scripts/check-env.sh: every ${VAR} a docker/*.yml interpolates must be
      # documented in its paired .env.example. Pure text comparison — no Docker
      # daemon, nothing to be flaky.
      - name: Lint environment documentation
        run: pnpm lint:env

      # scripts/check-generated.sh: regenerates the SDK client and the api-errors
      # catalogue from the committed OpenAPI snapshot and fails on a diff. Pure
      # codegen from a checked-in file — no API build, no Docker.
      - name: Check generated output
        run: pnpm check:generated

      - name: Check formatting
        run: pnpm format:check

      # Vitest browser-mode specs drive a real Chromium via the Playwright
      # provider. ubuntu-latest runners have no Playwright browser cache, so
      # install the browser (and its OS deps) before the Test step. playwright
      # is a workspace-member devDependency (not a root one), so the install
      # must run through a member that declares it.
      - name: Install Playwright browser
        run: pnpm --filter ./packages/testing exec playwright install --with-deps chromium

      # No standalone "build packages first" step is needed, and not because
      # typecheck reads a dependency's .d.ts:
      # in-repo every @bc-solutions-coder/* exports map points at src/, so a
      # dependent typechecks against source. typecheck and test declare
      # dependsOn ["^build"] in turbo.jsonc for the cache key — it folds the
      # dependency's hash into theirs, so a changed package cannot replay a
      # stale downstream pass. Building is a side effect of that, not the point.
      #
      # Every task runs on every PR: unchanged packages restore from cache, so
      # the merge commit keeps the guarantee that everything actually passed.
      # This is two invocations rather than one only because of the concurrency
      # cap the Test step below explains — the task GRAPH is still single, and
      # test's dependsOn ["^build"] resolves against the builds cached here.
      - name: Build and typecheck
        run: pnpm exec turbo run build typecheck

      # SEPARATE invocation, and `pnpm test` rather than a third task on the line
      # above, because the root `test` script carries `--concurrency=1` and turbo
      # applies a concurrency to the whole run graph. Folded in above it would
      # serialise build and typecheck too, for no reason. See Wallow-pr34: the
      # browser-mode suites take each other down when several run at once, and
      # every intermediate cap measured (2, 3, 4, and per-project maxWorkers) was
      # still red. Build and typecheck stay fully parallel; only the browser
      # suites queue.
      - name: Test
        run: pnpm test

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: |
            packages/**/__screenshots__/**
            apps/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 7

      # publint + @arethetypeswrong/cli over the built packages: the manifest's
      # exports map and every entrypoint's type resolution, checked against the
      # packed tarball rather than against the working tree. Stays outside turbo
      # and last — it needs every dist/ present at once, which a root task
      # cannot express.
      - name: Check package export surface
        run: pnpm check:exports

      - name: Verify external package consumer
        run: pnpm check:external-consumer
