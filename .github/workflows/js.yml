name: JS CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "scripts/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".nvmrc"
      - ".npmrc"
      - ".github/workflows/js.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "scripts/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".nvmrc"
      - ".npmrc"
      - ".github/workflows/js.yml"

concurrency:
  group: js-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Second oxlint pass: the test and story files `pnpm lint` excludes, with
      # the vitest plugin enabled. See scripts/lint-tests.sh.
      - name: Lint tests
        run: pnpm lint:tests

      - name: Check formatting
        run: pnpm format:check

      # Workspace members resolve @bc-solutions-coder/* packages through their
      # package.json `exports` maps, which point at dist/. Build every package
      # first — in topological order, so a package is always built before any
      # package that depends on it — so dependent members (the apps) can
      # typecheck against the emitted .d.ts files.
      - name: Build packages
        run: pnpm --filter './packages/*' build

      # publint + @arethetypeswrong/cli over the built packages: the manifest's
      # exports map and every entrypoint's type resolution, checked against the
      # packed tarball rather than against the working tree.
      - name: Check package export surface
        run: pnpm check:exports

      - name: Typecheck
        run: pnpm typecheck

      # Vitest browser-mode specs drive a real Chromium via the Playwright
      # provider. ubuntu-latest runners have no Playwright browser cache, so
      # install the browser (and its OS deps) before the Test step. playwright
      # is a workspace-member devDependency (not a root one), so the install
      # must run through a member that declares it.
      - name: Install Playwright browser
        run: pnpm --filter ./packages/testing exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
