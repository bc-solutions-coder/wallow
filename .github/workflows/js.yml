name: JS CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.jsonc"
      - "scripts/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".nvmrc"
      - ".npmrc"
      - ".github/workflows/js.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.jsonc"
      - "scripts/**"
      - ".oxlintrc.json"
      - ".oxfmtrc.json"
      - ".nvmrc"
      - ".npmrc"
      - ".github/workflows/js.yml"

concurrency:
  group: js-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo's cache directory, keyed per branch. Weaker than a cache shared
      # across machines — a first run on a new branch restores from the
      # most recent prefix match and re-executes whatever moved — but it turns a
      # same-branch push into a mostly-cached run.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      # Second oxlint pass: the test and story files `pnpm lint` excludes, with
      # the vitest plugin enabled. See scripts/lint-tests.sh.
      - name: Lint tests
        run: pnpm lint:tests

      # sherif: workspace manifest hygiene (dependency version alignment,
      # ordering, root-manifest shape). Zero-config; the script is the config.
      - name: Lint manifests
        run: pnpm lint:manifests

      # knip: unused files, exports and dependencies. Needs no dist/ — it
      # resolves workspace imports from source, so it runs before the build.
      - name: Lint dependency graph
        run: pnpm lint:deps

      - name: Check formatting
        run: pnpm format:check

      # Vitest browser-mode specs drive a real Chromium via the Playwright
      # provider. ubuntu-latest runners have no Playwright browser cache, so
      # install the browser (and its OS deps) before the Test step. playwright
      # is a workspace-member devDependency (not a root one), so the install
      # must run through a member that declares it.
      - name: Install Playwright browser
        run: pnpm --filter ./packages/testing exec playwright install --with-deps chromium

      # One task graph, not three phases. Workspace members resolve
      # @bc-solutions-coder/* packages through their package.json `exports`
      # maps, which point at dist/, which is why typecheck and test both declare
      # dependsOn ["^build"] in turbo.jsonc — a dependency is always built
      # before a dependent reads its .d.ts files, so no standalone build step is
      # needed ahead of them.
      #
      # Every task runs on every PR: unchanged packages restore from cache, so
      # the merge commit keeps the guarantee that everything actually passed.
      - name: Build, typecheck and test
        run: pnpm exec turbo run build typecheck test

      # publint + @arethetypeswrong/cli over the built packages: the manifest's
      # exports map and every entrypoint's type resolution, checked against the
      # packed tarball rather than against the working tree. Stays outside turbo
      # and last — it needs every dist/ present at once, which a root task
      # cannot express.
      - name: Check package export surface
        run: pnpm check:exports
