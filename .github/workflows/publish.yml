name: Publish
"on":
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main CI run to publish
        required: true
        type: string
      run_attempt:
        description: Exact successful CI attempt
        required: true
        type: string
      release_id:
        description: Optional release ID matching that CI commit
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: verified-publication
  cancel-in-progress: false
  queue: max
jobs:
  authorize:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.id == github.repository_id &&
      github.event.workflow_run.head_repository.id == github.repository_id)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      current: ${{ steps.inspect.outputs.current }}
      route: ${{ steps.inspect.outputs.route }}
      source: ${{ steps.inspect.outputs.source }}
    steps:
      - name: Check out protected controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Authorize producer and inspect sealed candidates
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_IMAGE_PUBLISH: ${{ vars.ENABLE_IMAGE_PUBLISH }}
          PRODUCER_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
          PRODUCER_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
        run: |
          mkdir .ci-publication
          python3 scripts/ci/publication_plan.py --run-id "$PRODUCER_RUN" --attempt "$PRODUCER_ATTEMPT" --output .ci-publication/plan.json
          python3 scripts/ci/validation.py seal --file .ci-publication/plan.json --manifest .ci-publication/plan.json.json --kind publication-plan --variant authorized
      - name: Retain sealed authorized publication plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-publication/plan.json*
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Retain dependency and image scan diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-scan-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-publication/dependency-scan
            .ci-publication/image-scan
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain prepared application images
        if: steps.inspect.outputs.route == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-images-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-prepared/app/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Retain prepared infrastructure images
        if: steps.inspect.outputs.route == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-images-infra-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-prepared/infra/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Retain prepared documentation images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-images-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-prepared/docs/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Retain exact prepared Pages archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prepared-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-prepared/site/artifact.tar
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  release-please:
    needs: authorize
    if: needs.authorize.outputs.current == 'true' && vars.ENABLE_RELEASE_AUTOMATION == 'true'
    uses: ./.github/workflows/release-please.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      source_sha: ${{ needs.authorize.outputs.source }}
  publish-packages:
    needs: [authorize, release-please]
    if: >-
      always() && needs.authorize.result == 'success' &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') &&
      vars.ENABLE_PACKAGE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: package-publish
      deployment: false
    permissions:
      contents: read
      actions: read
      checks: read
      packages: write
    steps:
      - name: Check out protected controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_PACKAGE_PUBLISH: ${{ vars.ENABLE_PACKAGE_PUBLISH }}
          PRODUCER_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
          PRODUCER_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          release_args=()
          if [[ -n "$RELEASE_ID" ]]; then release_args=(--release-id "$RELEASE_ID"); fi
          python3 scripts/ci/publication_publish_packages.py --producer-run "$PRODUCER_RUN" --producer-attempt "$PRODUCER_ATTEMPT" "${release_args[@]}" --output .ci-packages/progress.json
      - name: Retain publishing result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-packages/*.json
          include-hidden-files: true
          if-no-files-found: ignore
  publish-images:
    needs: [authorize, release-please]
    if: >-
      always() && needs.authorize.result == 'success' &&
      (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') &&
      vars.ENABLE_IMAGE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: image-publish
      deployment: false
    permissions:
      contents: read
      actions: read
      checks: read
      packages: write
    steps:
      - name: Check out protected controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish validated images
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLE_IMAGE_PUBLISH: ${{ vars.ENABLE_IMAGE_PUBLISH }}
          PRODUCER_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
          PRODUCER_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          release_args=()
          if [[ -n "$RELEASE_ID" ]]; then release_args=(--release-id "$RELEASE_ID"); fi
          python3 scripts/ci/publication_publish_images.py --producer-run "$PRODUCER_RUN" --producer-attempt "$PRODUCER_ATTEMPT" "${release_args[@]}" --output .ci-images/progress.json
      - name: Retain publishing result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: images-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-images/*.json
          include-hidden-files: true
          if-no-files-found: ignore
  publish-pages:
    needs: authorize
    if: needs.authorize.outputs.current == 'true' && vars.ENABLE_DOCS_DEPLOY == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source_sha: ${{ needs.authorize.outputs.source }}
