name: Publish
"on":
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact successful main CI run ID
        required: true
        type: string
      run_attempt:
        description: Exact successful CI attempt
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: verified-publication
  cancel-in-progress: false
  queue: max
jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.repository.id == github.repository_id &&
      github.event.workflow_run.head_repository.id == github.repository_id)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Check out protected controller revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Authorize exact registered producer
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
          PRODUCER_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
        run: |
          mkdir .ci-publication
          python3 scripts/ci/publication_plan.py --run-id "$PRODUCER_RUN" --attempt "$PRODUCER_ATTEMPT" --output .ci-publication/plan.json
          python3 scripts/ci/validation.py seal --file .ci-publication/plan.json --manifest .ci-publication/plan.json.json --kind publication-plan --variant authorized
      - name: Retain authorized metadata plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publication-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-publication/*
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
defaults:
  run:
    shell: bash
