name: Release Please
"on":
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_RELEASE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      deployment: false
    steps:
      - name: Confirm validated main is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$SOURCE_SHA" ]]; then echo 'release=true' >> "$GITHUB_OUTPUT"; fi
      - name: Reconcile release PRs and GitHub releases
        id: release
        if: steps.current.outputs.release == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          repo-url: ${{ github.repository }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          github-api-url: https://api.github.com
          github-graphql-url: https://api.github.com/graphql
          changelog-host: https://github.com
          fork: false
