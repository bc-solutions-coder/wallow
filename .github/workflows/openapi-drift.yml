name: OpenAPI Drift

# Fails a pull request whose packages/sdk/openapi/v1.json no longer matches the API
# contract. The emission recipe and the definition of "drift" live in the shared
# .github/actions/openapi-document composite action, which openapi-autoregen.yml also
# uses, so the check and the automated fix can never disagree about what drifted.
#
# This workflow deliberately runs on pull_request ONLY. A stale snapshot that reaches
# main is not a failure to report but a job to do: openapi-autoregen.yml picks it up
# there and opens a PR carrying the regenerated snapshot and client. Adding a push
# trigger here would paint main red for a condition that already has an owner, and
# would boot a second Postgres to learn what that workflow is learning anyway.
#
# The token this workflow runs with stays read-only. It is the one of the two that
# checks out pull-request code, so it must never hold contents or pull-requests write.

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "packages/sdk/openapi/**"
      - "packages/sdk/openapi-ts.config.ts"
      - "packages/sdk/scripts/generate.ts"
      - ".github/actions/openapi-document/**"
      - ".github/workflows/openapi-drift.yml"

concurrency:
  group: openapi-drift-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wallow
          POSTGRES_PASSWORD: wallow
          POSTGRES_DB: wallow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Emit OpenAPI document and detect drift
        id: openapi
        uses: ./.github/actions/openapi-document
        with:
          connection-string: "Host=localhost;Port=5432;Database=wallow_test;Username=wallow;Password=wallow"

      - name: Fail on OpenAPI snapshot drift
        if: steps.openapi.outputs.drift == 'true'
        env:
          REASON: ${{ steps.openapi.outputs.reason }}
          DIFF_FILE: ${{ steps.openapi.outputs.diff-file }}
        run: |
          cat "$DIFF_FILE"
          if [ "$REASON" = "servers" ]; then
            echo "::error::packages/sdk/openapi/v1.json declares the wrong servers[0].url."
            echo "::error::Refresh the snapshot against an API served from http://localhost:5001/."
          else
            echo "::error::packages/sdk/openapi/v1.json is out of date with the API contract."
          fi
          echo "::error::Refresh it locally and commit the result:"
          echo "::error::  cd docker && docker compose up -d"
          echo "::error::  dotnet run --project api/src/Wallow.Api"
          echo "::error::  WALLOW_OPENAPI_URL=http://localhost:5001/openapi/v1.json pnpm --filter @bc-solutions-coder/sdk exec tsx scripts/generate.ts"
          echo "::error::  pnpm --filter @bc-solutions-coder/api-errors generate"
          echo "::error::  git add packages/sdk/openapi packages/sdk/src/generated packages/api-errors/src/generated && git commit"
          exit 1
