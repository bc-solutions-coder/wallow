name: Security

on:
  workflow_call:
    inputs:
      docs-only:
        type: boolean
        default: false
      profile:
        type: string
        required: true

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
      - name: Record security contract
        env:
          SELECTED_PROFILE: ${{ inputs.profile }}
          DOCS_ONLY: ${{ inputs.docs-only }}
        run: |
          mkdir -p .ci-reports/security
          python3 - <<'PY'
          import json, os, pathlib
          profile = os.environ['SELECTED_PROFILE']
          if profile not in ('portable', 'codeql'):
              raise SystemExit('Invalid selected security profile')
          summary = {
              'profile': profile,
              'docs_only': os.environ['DOCS_ONLY'],
              'source': 'DevSkim 1.0.90 bundled rules, zizmor 1.30.0 regular persona; existing .NET analyzers and Actionlint run in CI',
              'vulnerabilities': 'Trivy 0.74.0 with current vulnerability database; fixable high/critical findings block',
              'limits': 'Portable analysis has reduced cross-function/framework coverage. Offline zizmor omits remote API audits. CodeQL default queries are required separately when selected. Docs-only route scans docs images.',
              'maintenance': 'Maintainers review pins and bundled rule updates monthly; urgent security updates promptly. Exceptions require normal PR review and expire within 30 days.',
          }
          pathlib.Path('.ci-reports/security/coverage.json').write_text(json.dumps(summary, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(json.dumps(summary, indent=2) + '\n')
          PY
      - name: Install pinned scanners and obtain vulnerability database
        id: tools
        run: bash scripts/ci/run-security.sh install
      - name: Analyze source with bundled DevSkim rules
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && !inputs.docs-only }}
        run: bash scripts/ci/run-security.sh devskim
      - name: Analyze workflows offline
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && !inputs.docs-only }}
        run: bash scripts/ci/run-security.sh zizmor
      - name: Scan resolved dependencies including build dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && !inputs.docs-only }}
        run: bash scripts/ci/run-security.sh dependencies
      - name: Seal resolved dependency inputs for later policy scans
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p .ci-artifacts/dependency-inputs
          cp .ci-reports/security/dependency-inventory.json .ci-tools/dependencies/inventory.json
          tar -czf .ci-artifacts/dependency-inputs/dependencies.tar.gz -C .ci-tools/dependencies .
          python3 scripts/ci/validation.py seal --file .ci-artifacts/dependency-inputs/dependencies.tar.gz --manifest .ci-artifacts/dependency-inputs/dependencies.tar.gz.json --kind dependencies --variant resolved-locks
      - name: Retain exact resolved dependency inputs
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/dependency-inputs/*
          if-no-files-found: error
          retention-days: 30
      - name: Download exact application images
        id: app
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && !inputs.docs-only }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: images-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/images-app
      - name: Scan each application platform image
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: bash scripts/ci/run-security.sh images app
      - name: Download exact infrastructure images
        id: infra
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && !inputs.docs-only }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: images-infra-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/images-infra
      - name: Scan each infrastructure platform image
        if: ${{ !cancelled() && steps.infra.outcome == 'success' }}
        run: bash scripts/ci/run-security.sh images infra
      - name: Download exact docs images
        id: docs
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: images-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-artifacts/images-docs
      - name: Scan each docs platform image
        if: ${{ !cancelled() && steps.docs.outcome == 'success' }}
        run: bash scripts/ci/run-security.sh images docs
      - name: Retain security findings, identities and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/security
          if-no-files-found: error
          retention-days: 30
