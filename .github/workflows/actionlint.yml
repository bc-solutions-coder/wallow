name: Actionlint

# Workflow-file lint. Local twin: `pnpm lint:actions` (scripts/lint-actions.sh).
# Path-filtered: only workflow/action edits can break workflows.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"

concurrency:
  group: actionlint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download verified actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint

      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
