name: Publish validated documentation
"on":
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DOCS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Skip an older main build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$SOURCE_SHA" ]]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy validated site
        id: deploy
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: prepared-site-${{ github.run_id }}-${{ github.run_attempt }}
