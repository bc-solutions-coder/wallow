name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "api/src/**/*.cs"
      - "packages/styles/branding.json"
      - "docfx.json"
      - "docfx/templates/**"
      - "packages/testing/package.json"
      - "packages/testing/scripts/docfx-contrast.mjs"
      - ".nvmrc"
      - "scripts/generate-docs-theme.mjs"
      - "docker/docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "api/src/**/*.cs"
      - "packages/styles/branding.json"
      - "docfx.json"
      - "docfx/templates/**"
      - "packages/testing/package.json"
      - "packages/testing/scripts/docfx-contrast.mjs"
      - ".nvmrc"
      - "scripts/generate-docs-theme.mjs"
      - "docker/docs/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install DocFX test dependencies
        run: pnpm install --frozen-lockfile --filter @bc-solutions-coder/testing

      - name: Install Playwright browser
        run: pnpm --filter ./packages/testing exec playwright install --with-deps chromium

      - name: Generate theme CSS
        run: |
          mkdir -p docfx/templates/wallow/public
          node scripts/generate-docs-theme.mjs packages/styles/branding.json

      - name: Restore tools and build docs
        run: |
          dotnet restore api/Wallow.slnx
          dotnet tool restore
          dotnet docfx docfx.json

      - name: Test rendered theme contrast
        run: pnpm --filter @bc-solutions-coder/testing test:docfx

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docfx-site
          path: .docfx/_site
